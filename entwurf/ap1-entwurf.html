<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP1 Lerntracker</title>
<style>
/* Aufbau: schmale Leiste links, eine Inhaltsspalte fester Breite (66rem), Gliederung über Abstand und Schriftgröße.
   Jede Stilrichtung setzt nur Tokens; alle Bausteine lesen ausschließlich diese Tokens. */
:root { color-scheme: dark; }

/* A · Notizbuch: zurückhaltend, Serifenschrift, Haarlinien, kaum Spiel */
:root, :root[data-stil="notizbuch"] {
  --font: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style", Georgia, serif;
  --fs-1: .875rem; --fs-2: 1rem; --fs-3: 1.25rem; --fs-4: 1.75rem;
  --lh: 1.6; --w-kopf: 600;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  --radius: 4px;
  --dur: 220ms; --ease: cubic-bezier(.2,.7,.2,1); --ease-pop: cubic-bezier(.2,.7,.2,1);
  --einzug: 40px; --haken: 18px; --balken: 2px;
  --bg: #15171a; --leiste: #111316; --flaeche: #1c1f23; --linie: #2b2f35; --hover: rgba(220,228,240,.035);
  --text: #e6e3dc; --gedaempft: #a1a5ad; --blass: #686d76;
  --akzent: #8fb3d9; --akzent-tinte: #0e1620; --akzent-hauch: rgba(143,179,217,.13); --glut: transparent;
  --ap2: #c4a3d6; --wiso: #a6c79a;
}
/* B · Konsole: Monospace, harte Kanten, Rasterschritte, mittleres Spiel */
:root[data-stil="konsole"] {
  --font: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", ui-monospace, monospace;
  --fs-1: .8125rem; --fs-2: .875rem; --fs-3: 1rem; --fs-4: 1.375rem;
  --lh: 1.6; --w-kopf: 700;
  --s1: 4px; --s2: 12px; --s3: 20px; --s4: 28px; --s5: 40px; --s6: 56px;
  --radius: 0px;
  --dur: 120ms; --ease: linear; --ease-pop: steps(3, end);
  --einzug: 32px; --haken: 16px; --balken: 8px;
  --bg: #0f100d; --leiste: #0b0c09; --flaeche: #171812; --linie: #2e3026; --hover: rgba(232,163,61,.06);
  --text: #e2dfcf; --gedaempft: #9d9a89; --blass: #67654f;
  --akzent: #e8a33d; --akzent-tinte: #1a1205; --akzent-hauch: rgba(232,163,61,.13); --glut: transparent;
  --ap2: #5fb6d9; --wiso: #d9786a;
}
/* C · Level: technische Grotesk, weiche Flächen, federnde Effekte, deutliches Spiel */
:root[data-stil="level"] {
  --font: Bahnschrift, "DIN Alternate", "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-1: .8125rem; --fs-2: .9375rem; --fs-3: 1.25rem; --fs-4: 2rem;
  --lh: 1.55; --w-kopf: 600;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 56px; --s6: 80px;
  --radius: 12px;
  --dur: 300ms; --ease: cubic-bezier(.22,.8,.24,1); --ease-pop: cubic-bezier(.34,1.56,.64,1);
  --einzug: 40px; --haken: 20px; --balken: 8px;
  --bg: #0f111a; --leiste: #0b0d14; --flaeche: #171a26; --linie: #272b3c; --hover: rgba(95,224,176,.05);
  --text: #eceef7; --gedaempft: #a3a8bf; --blass: #646a84;
  --akzent: #5fe0b0; --akzent-tinte: #052219; --akzent-hauch: rgba(95,224,176,.13); --glut: rgba(95,224,176,.45);
  --ap2: #ff8a78; --wiso: #ffcf5c;
}
:root { --kante: calc(var(--einzug) + var(--s2)); --leiste-b: 112px; }

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-2); line-height: var(--lh);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p, ul { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
svg.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Rahmen ---------- */
.app { display: grid; grid-template-columns: var(--leiste-b) minmax(0, 1fr); min-height: 100vh; }
.leiste {
  position: sticky; top: 0; height: 100vh; z-index: 10;
  display: flex; flex-direction: column; gap: var(--s4);
  padding: var(--s3) var(--s1); background: var(--leiste); border-right: 1px solid var(--linie);
}
.nav { display: flex; flex-direction: column; gap: var(--s1); }
.nav-punkt {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: var(--s2) 4px; border-radius: var(--radius);
  color: var(--gedaempft); font-size: var(--fs-1); line-height: 1.2; text-decoration: none;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.nav-punkt:not([aria-disabled="true"]):hover { color: var(--text); background: var(--hover); }
.nav-punkt[aria-current="page"] { color: var(--text); background: var(--akzent-hauch); }
.nav-punkt[aria-current="page"] .ico { color: var(--akzent); }
.nav-punkt[aria-disabled="true"] { opacity: .36; cursor: not-allowed; }

/* Prüfungskennung oben links */
.pruefung { position: relative; }
.pruefung-knopf {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 40px;
  border-radius: var(--radius); color: var(--gedaempft); font-size: var(--fs-1); font-weight: 600; letter-spacing: .08em;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.pruefung-knopf:hover, .pruefung-knopf[aria-expanded="true"] { color: var(--text); background: var(--hover); }
.pruefung-knopf .pfeil { width: 16px; height: 16px; }
.pruefung-menue {
  position: absolute; top: calc(100% + var(--s1)); left: 0; z-index: 30;
  width: 20rem; max-width: calc(100vw - 32px); padding: var(--s1);
  display: grid; gap: 2px;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  box-shadow: 0 16px 40px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(-4px); visibility: hidden;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
}
.pruefung-menue[data-offen="true"] { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.pm-punkt {
  display: grid; grid-template-columns: 8px minmax(0, 1fr) 16px; align-items: center; gap: var(--s2);
  width: 100%; padding: var(--s1) var(--s2); border-radius: var(--radius);
  transition: background-color var(--dur) var(--ease);
}
.pm-punkt:hover { background: var(--hover); }
.pm-farbe { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pm-name { font-weight: 600; }
.pm-titel { display: block; font-size: var(--fs-1); color: var(--gedaempft); line-height: 1.35; }
.pm-punkt .ico { width: 16px; height: 16px; color: var(--akzent); }
.pm-hinweis { margin-top: 4px; padding: var(--s1) var(--s2) 4px; border-top: 1px solid var(--linie); font-size: var(--fs-1); color: var(--blass); }

/* ---------- Inhaltsspalte ---------- */
.haupt { min-width: 0; padding: var(--s6) var(--s4) 160px; }
.spalte { width: min(100%, 66rem); margin-inline: auto; }
.seitenkopf { display: grid; gap: var(--s2); padding-bottom: var(--s5); }
.eyebrow, .label { font-size: var(--fs-1); color: var(--gedaempft); }
.titel { font-size: var(--fs-4); line-height: 1.2; font-weight: var(--w-kopf); text-wrap: balance; }
.lead { color: var(--gedaempft); max-width: 60ch; }
.stand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s1) var(--s2); margin-top: var(--s1); font-size: var(--fs-1); color: var(--gedaempft); }
.zahl { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

/* Fortschrittsbalken */
.balken { position: relative; display: block; height: var(--balken); background: var(--linie); border-radius: var(--radius); overflow: hidden; }
.balken > i {
  position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 100%);
  background: var(--akzent); border-radius: inherit;
  transition: width var(--dur) var(--ease);
}

/* Ordner-Auswahl: die acht Oberordner als Schritte nebeneinander */
@property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
.ordner-tabs-rahmen { margin-bottom: var(--s5); }
.ordner-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s1); }
.ot {
  display: grid; align-content: start; gap: 6px; min-width: 0; padding: var(--s1) var(--s1) var(--s2);
  border-radius: var(--radius); color: var(--gedaempft); font-size: var(--fs-1); line-height: 1.3;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.ot:hover { background: var(--hover); color: var(--text); }
.ot[aria-selected="true"] { background: var(--akzent-hauch); color: var(--text); }
.ot-nr { display: flex; align-items: center; justify-content: space-between; color: var(--blass); font-variant-numeric: tabular-nums; font-weight: 600; }
.ot-nr .ico { display: none; width: 14px; height: 14px; color: var(--akzent); stroke-width: 2.2; }
.ot[data-fertig] .ot-nr .ico { display: block; }
.ot[aria-selected="true"] .ot-nr { color: var(--akzent); }
.ot-titel { overflow-wrap: break-word; }
.balken.mini { height: min(var(--balken), 4px); }

/* Kopf des gewählten Ordners */
.ordner-ansicht { display: grid; gap: var(--s3); transition: opacity var(--dur) var(--ease); }
.ordner-ansicht.wechsel { opacity: 0; }
.okopf { display: flex; align-items: center; gap: var(--s2); }
.okopf-marke {
  display: grid; place-items: center; flex: none; min-width: 44px; height: 44px; padding: 0 var(--s1);
  border: 1px solid var(--linie); border-radius: var(--radius); color: var(--akzent); font-size: var(--fs-1); font-weight: 700; font-variant-numeric: tabular-nums;
}
.okopf-text { display: grid; gap: 2px; min-width: 0; }
.okopf-titel { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; text-wrap: balance; }
.okopf-stand { font-size: var(--fs-1); color: var(--gedaempft); }

.bloecke { display: grid; gap: var(--s3); }

/* Blockkarte: Kopf, darunter links die Stichpunkte, rechts Kurzinfo und Wiederholung */
.bk { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); }
.bk-kopf { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto 40px; align-items: center; column-gap: var(--s2); padding: var(--s1) var(--s1) var(--s1) var(--s3); min-height: 56px; }
.bk-status {
  position: relative; width: 20px; height: 20px; border-radius: 50%;
  background: conic-gradient(var(--akzent) calc(var(--p) * 360deg), var(--linie) 0);
  -webkit-mask: radial-gradient(circle, transparent 6px, #000 6.5px); mask: radial-gradient(circle, transparent 6px, #000 6.5px);
  transition: --p var(--dur) var(--ease);
}
.bk[data-fertig] .bk-status { -webkit-mask: none; mask: none; background: var(--akzent); }
.bk-status svg { position: absolute; inset: 2px; width: 16px; height: 16px; fill: none; stroke: var(--akzent-tinte); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.bk[data-fertig] .bk-status svg { opacity: 1; }
.bk-titel { font-size: var(--fs-2); font-weight: var(--w-kopf); line-height: 1.35; overflow-wrap: anywhere; }
.bk-stand { font-size: var(--fs-1); color: var(--gedaempft); white-space: nowrap; }
.bk-stand .zahl { font-weight: 400; }
.bk-klapp { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius); transition: background-color var(--dur) var(--ease); }
.bk-klapp:hover { background: var(--hover); }
.bk-klapp:hover .pfeil { color: var(--text); }
.bk-inhalt { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; border-top: 1px solid var(--linie); }
.bk-liste { display: grid; align-content: start; gap: var(--s1); padding: var(--s2) var(--s2) var(--s3) var(--s3); }
.bk-seite { display: grid; align-content: start; gap: var(--s4); padding: var(--s2) var(--s3) var(--s3); border-left: 1px solid var(--linie); font-size: var(--fs-1); }
.sp-liste { list-style: none; padding: 0; margin: 0; display: grid; }

/* Stichpunkt */
.sp-zeile {
  display: grid; grid-template-columns: calc(var(--haken) + var(--s2)) minmax(0, 1fr); align-items: start;
  border-radius: var(--radius); transition: background-color var(--dur) var(--ease);
}
.sp-zeile:hover { background: var(--hover); }
.haken { display: flex; align-items: center; justify-content: flex-start; width: 100%; height: 40px; padding-left: 0; }
.haken-box {
  display: grid; place-items: center; width: var(--haken); height: var(--haken);
  border: 1.5px solid var(--blass); border-radius: min(var(--radius), calc(var(--haken) / 2));
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.haken-box svg { width: 100%; height: 100%; fill: none; stroke: var(--akzent-tinte); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.haken-box path { stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset var(--dur) var(--ease); }
.haken:hover .haken-box { border-color: var(--akzent); }
.haken[aria-checked="true"] .haken-box { background: var(--akzent); border-color: var(--akzent); }
.haken[aria-checked="true"] path { stroke-dashoffset: 0; transition-delay: calc(var(--dur) / 3); }
.haken:disabled .haken-box { border-color: var(--linie); background: var(--hover); }
.haken:disabled:hover .haken-box { border-color: var(--linie); }

.sp-knopf {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; align-items: start; column-gap: var(--s2);
  padding-block: calc((40px - var(--fs-2) * var(--lh)) / 2); padding-right: var(--s1); min-height: 40px;
}
.sp-titel { transition: color var(--dur) var(--ease); overflow-wrap: anywhere; }
.sp[data-erledigt] .sp-titel { color: var(--gedaempft); }
.art { font-size: var(--fs-1); color: var(--gedaempft); white-space: nowrap; line-height: calc(var(--fs-2) * var(--lh)); }
.pfeil { display: grid; place-items: center; width: 24px; height: calc(var(--fs-2) * var(--lh)); color: var(--blass); transition: transform var(--dur) var(--ease), color var(--dur) var(--ease); }
.pfeil::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
[aria-expanded="true"] > .pfeil { transform: rotate(180deg); color: var(--akzent); }
.info { display: grid; place-items: center; width: 24px; height: calc(var(--fs-2) * var(--lh)); color: var(--blass); transition: color var(--dur) var(--ease); }
.info .ico { width: 16px; height: 16px; }
.sp-knopf:hover .info { color: var(--text); }
.sp[data-gewaehlt] .sp-zeile { background: var(--akzent-hauch); }
.sp[data-gewaehlt] .sp-titel { color: var(--text); }
.sp[data-gewaehlt] .info { color: var(--akzent); }

/* Aufklappen: schiebt den Rest weich nach unten */
.klapp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur) var(--ease); }
.klapp[data-offen="true"] { grid-template-rows: 1fr; }
.klapp-innen { min-height: 0; overflow: hidden; opacity: 0; transition: opacity var(--dur) var(--ease); }
.klapp[data-offen="true"] > .klapp-innen { opacity: 1; }

/* Kurzinfo zum gewählten Stichpunkt */
.ki { display: grid; gap: var(--s2); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.ki.wechsel { opacity: 0; transform: translateY(4px); }
.ki-kopf { display: grid; gap: 4px; }
.ki-titel { font-size: var(--fs-2); font-weight: var(--w-kopf); line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
.ki-meta { color: var(--gedaempft); }
.ki-hinweis { color: var(--blass); font-style: italic; }
.feld { display: grid; gap: var(--s1); }
.koennen { list-style: none; padding: 0; display: grid; gap: var(--s1); }
.koennen li { position: relative; padding-left: 1.25em; }
.koennen li::before { content: "–"; position: absolute; left: 0; color: var(--blass); }
.aktionen { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Wiederholung je Block */
.wdh { display: grid; gap: var(--s1); padding-top: var(--s3); border-top: 1px solid var(--linie); }
.wdh-text { color: var(--gedaempft); }
.wdh-knoepfe { display: flex; gap: var(--s1); margin-top: 4px; }
.wdh-knopf {
  min-width: 44px; height: 36px; border: 1px solid var(--linie); border-radius: var(--radius);
  font-weight: 600; font-variant-numeric: tabular-nums; color: var(--gedaempft); text-align: center;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease-pop);
}
.wdh-knopf:not(:disabled):hover { border-color: var(--akzent); color: var(--text); }
.wdh-knopf[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-tinte); }
.wdh-knopf:disabled { opacity: .4; }

/* Knöpfe: zwei Arten */
.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  min-height: 40px; padding: 0 var(--s3); border: 1px solid transparent; border-radius: var(--radius);
  font-size: var(--fs-1); font-weight: 600; white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease-pop);
}
.knopf.primaer { background: var(--akzent); color: var(--akzent-tinte); }
.knopf.primaer:hover, .knopf.primaer.ist-hover { background: color-mix(in srgb, var(--akzent) 84%, white); }
.knopf.primaer:active, .knopf.primaer.ist-aktiv { background: color-mix(in srgb, var(--akzent) 78%, black); transform: translateY(1px); }
.knopf.sekundaer { border-color: var(--linie); color: var(--text); }
.knopf.sekundaer:hover, .knopf.sekundaer.ist-hover { border-color: var(--gedaempft); background: var(--hover); }
.knopf.sekundaer:active, .knopf.sekundaer.ist-aktiv { background: var(--akzent-hauch); border-color: var(--akzent); transform: translateY(1px); }
.knopf:disabled, .knopf:disabled:hover { background: transparent; border-color: var(--linie); color: var(--blass); transform: none; box-shadow: none; }
.knopf.primaer:disabled { background: var(--linie); border-color: var(--linie); }
.ist-hover, .ist-aktiv { pointer-events: none; }
.knopf.klein { min-height: 32px; padding: 0 var(--s2); }

/* Karte: die eine Art Karte */
.karte { display: grid; gap: var(--s2); max-width: 32rem; padding: var(--s3); background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); }
.karte-titel { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; text-wrap: balance; }
.karte-meta { font-size: var(--fs-1); color: var(--gedaempft); }

/* Rang-Chip im Kopf (nur Konsole und Level) */
.rang-chip { display: inline-flex; align-items: center; gap: var(--s1); color: var(--gedaempft); }

/* ---------- Bausteine-Seite ---------- */
.bs { display: grid; gap: var(--s3); padding-block: var(--s5); border-top: 1px solid var(--linie); }
.bs-kopf { display: grid; gap: var(--s1); }
.bs h2 { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; }
.bs-text { font-size: var(--fs-1); color: var(--gedaempft); max-width: 60ch; }
.zustand-name { font-size: var(--fs-1); color: var(--blass); }
.scroll-x { overflow-x: auto; }
.knopf-raster { display: grid; grid-template-columns: 6rem repeat(4, minmax(7.5rem, 1fr)); gap: var(--s2); align-items: center; min-width: 38rem; }
.muster-reihe { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); }
.muster { display: flex; align-items: center; gap: var(--s1); }
.muster .haken { width: auto; }
.zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.stapel { display: grid; gap: var(--s2); }
.leer { display: grid; justify-items: start; align-content: start; gap: var(--s1); padding: var(--s3); border: 1px dashed var(--linie); border-radius: var(--radius); }
.leer .ico { width: 24px; height: 24px; color: var(--blass); margin-bottom: var(--s1); }
.leer-titel { font-weight: 600; }
.leer-text { font-size: var(--fs-1); color: var(--gedaempft); }
.gesperrt { color: var(--blass); }
.gesperrt .leer-titel { color: var(--gedaempft); }
.gesperrt { border-style: solid; background: var(--hover); }

/* Rangabzeichen */
.raenge { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s2); }
.abz { display: grid; justify-items: center; align-content: start; gap: var(--s1); text-align: center; }
.abz-form { position: relative; display: grid; place-items: center; width: 56px; height: 56px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gedaempft); }
.abz-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); fill: none; stroke-width: 1.5; }
.abz-ring .grund { stroke: var(--linie); }
.abz-ring .voll { stroke: var(--akzent); stroke-dasharray: 145; stroke-dashoffset: 145; }
.abz-erreicht .abz-ring .voll, .abz-aktuell .abz-ring .voll { stroke-dashoffset: 0; }
.abz-erreicht .abz-form { color: var(--text); }
.abz-aktuell .abz-form { color: var(--akzent); }
.abz-gesperrt .abz-ring .grund { stroke-dasharray: 3 4; }
.abz-gesperrt .abz-form { color: var(--blass); }
.abz-schloss { display: none; }
.abz-name { font-size: var(--fs-1); color: var(--gedaempft); line-height: 1.3; overflow-wrap: anywhere; }
.abz-aktuell .abz-name { color: var(--text); font-weight: 600; }
.abz-gesperrt .abz-name { color: var(--blass); }
.abz-gross .abz-form { width: 96px; height: 96px; font-size: var(--fs-4); }

.rang-weg { display: grid; gap: var(--s1); }

/* Aktivitätsübersicht */
.aktiv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s1); }
.aktiv-tage { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; font-size: var(--fs-1); line-height: 14px; color: var(--blass); }
.raster { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
.raster i { border-radius: calc(var(--radius) / 4); background: var(--linie); }
.raster i[data-s="1"] { background: color-mix(in srgb, var(--akzent) 30%, var(--linie)); }
.raster i[data-s="2"] { background: color-mix(in srgb, var(--akzent) 55%, var(--linie)); }
.raster i[data-s="3"] { background: color-mix(in srgb, var(--akzent) 80%, var(--linie)); }
.raster i[data-s="4"] { background: var(--akzent); }
.raster i.heute { outline: 1px solid var(--text); outline-offset: 1px; }
.aktiv-fuss { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s1) var(--s3); font-size: var(--fs-1); color: var(--gedaempft); }
.legende { display: inline-flex; align-items: center; gap: 3px; }
.legende i { width: 14px; height: 14px; }

/* Besonderer Moment */
.moment {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
  background: rgba(4, 5, 8, .74);
  opacity: 0; visibility: hidden; transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur);
}
.moment[data-offen="true"] { opacity: 1; visibility: visible; transition-delay: 0s; }
.moment-karte {
  position: relative; width: min(100%, 24rem); display: grid; justify-items: center; gap: var(--s2); text-align: center;
  padding: var(--s5) var(--s4) var(--s4); background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  transform: translateY(8px); transition: transform var(--dur) var(--ease);
}
.moment[data-offen="true"] .moment-karte { transform: none; }
.moment-karte .knopf { margin-top: var(--s2); }
.moment .abz-ring .voll { stroke-dashoffset: 145; }
.moment[data-offen="true"] .abz-ring .voll { animation: ring calc(var(--dur) * 4) var(--ease) calc(var(--dur)) forwards; }
@keyframes ring { to { stroke-dashoffset: 0; } }
.moment h2 { font-size: var(--fs-4); font-weight: var(--w-kopf); line-height: 1.2; }
.moment-text { color: var(--gedaempft); font-size: var(--fs-1); }
.log { display: none; }
.funken { position: absolute; left: 50%; top: calc(var(--s5) + 48px); width: 0; height: 0; pointer-events: none; }

/* Hinweis unten */
.hinweis {
  position: fixed; left: calc(50% + var(--leiste-b) / 2); bottom: 84px; z-index: 40;
  max-width: calc(100vw - 32px); padding: var(--s1) var(--s2);
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  font-size: var(--fs-1); color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.4);
  opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.hinweis[data-offen="true"] { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Stilrichtung A · Notizbuch ---------- */
[data-stil="notizbuch"] .eyebrow, [data-stil="notizbuch"] .label { font-size: var(--fs-2); font-variant-caps: all-small-caps; letter-spacing: .07em; }
[data-stil="notizbuch"] .art { font-style: italic; }
[data-stil="notizbuch"] .rang-chip { display: none; }
[data-stil="notizbuch"] .bk { background: transparent; }

/* ---------- Stilrichtung B · Konsole ---------- */
[data-stil="konsole"] .label, [data-stil="konsole"] .eyebrow { text-transform: lowercase; }
[data-stil="konsole"] .label::before { content: "// "; color: var(--blass); }
[data-stil="konsole"] .titel::after { content: "▍"; margin-left: .15em; color: var(--akzent); font-weight: 400; animation: blinken 1s steps(1) 4; }
@keyframes blinken { 50% { opacity: 0; } }
[data-stil="konsole"] .balken, [data-stil="konsole"] .balken > i { background: repeating-linear-gradient(90deg, var(--linie) 0 6px, transparent 6px 8px); }
[data-stil="konsole"] .balken > i { background: repeating-linear-gradient(90deg, var(--akzent) 0 6px, transparent 6px 8px); transition-timing-function: steps(6, end); }
[data-stil="konsole"] .balken.mini { height: 4px; }
[data-stil="konsole"] .pfeil::before { content: "+"; width: auto; height: auto; border: 0; transform: none; }
[data-stil="konsole"] [aria-expanded="true"] > .pfeil { transform: none; }
[data-stil="konsole"] [aria-expanded="true"] > .pfeil::before { content: "−"; }
[data-stil="konsole"] .haken-box path { transition-timing-function: steps(4, end); }
[data-stil="konsole"] .art::before { content: "#"; }
[data-stil="konsole"] .art { text-transform: lowercase; }
[data-stil="konsole"] .koennen li::before { content: ">"; color: var(--akzent); }
[data-stil="konsole"] .knopf.sekundaer::before { content: "["; color: var(--blass); }
[data-stil="konsole"] .knopf.sekundaer::after { content: "]"; color: var(--blass); }
[data-stil="konsole"] .knopf.primaer:active, [data-stil="konsole"] .knopf.ist-aktiv { transform: translate(1px, 1px); }
[data-stil="konsole"] .rang-chip { color: var(--gedaempft); }
[data-stil="konsole"] .rang-chip b { color: var(--akzent); font-weight: 400; }
[data-stil="konsole"] .sp-zeile:hover, [data-stil="konsole"] .sp[data-gewaehlt] .sp-zeile { box-shadow: inset 2px 0 0 var(--akzent); }
[data-stil="konsole"] .bk-status, [data-stil="konsole"] .bk[data-fertig] .bk-status { justify-self: center; width: 8px; height: 20px; border-radius: 0; -webkit-mask: none; mask: none; background: linear-gradient(to top, var(--akzent) calc(var(--p) * 100%), var(--linie) 0); transition-timing-function: steps(4, end); }
[data-stil="konsole"] .bk-status svg { display: none; }
[data-stil="konsole"] .ot[aria-selected="true"] { background: transparent; box-shadow: inset 0 -2px 0 var(--akzent); }
[data-stil="konsole"] .okopf-marke { border-style: dashed; }
[data-stil="konsole"] .wdh { border-top-style: dashed; }
[data-stil="konsole"] .ki.wechsel { transform: none; }
[data-stil="konsole"] .abz-ring { display: none; }
[data-stil="konsole"] .abz-form { border: 1px solid var(--linie); }
[data-stil="konsole"] .abz-erreicht .abz-form { border-color: var(--gedaempft); }
[data-stil="konsole"] .abz-aktuell .abz-form { border-color: var(--akzent); background: var(--akzent); color: var(--akzent-tinte); }
[data-stil="konsole"] .abz-gesperrt .abz-form { border-style: dashed; }
[data-stil="konsole"] .moment-karte { justify-items: start; text-align: left; }
[data-stil="konsole"] .moment .abz-form { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-tinte); }
[data-stil="konsole"] .log { display: block; margin: 0; width: 100%; font: inherit; font-size: var(--fs-1); color: var(--gedaempft); white-space: pre-wrap; min-height: calc(5 * var(--fs-1) * 1.6); }
[data-stil="konsole"] .log b { color: var(--akzent); font-weight: 400; }
[data-stil="konsole"] .moment-ende { display: grid; gap: var(--s2); justify-items: start; }
[data-stil="konsole"] .moment-ende[hidden] { display: none; }

/* ---------- Stilrichtung C · Level ---------- */
[data-stil="level"] .eyebrow, [data-stil="level"] .label { text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
[data-stil="level"] .balken > i { box-shadow: 0 0 12px var(--glut); }
[data-stil="level"] .balken > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); }
[data-stil="level"] .balken.glanz > i::after { animation: glanz calc(var(--dur) * 3) var(--ease); }
@keyframes glanz { to { transform: translateX(100%); } }
[data-stil="level"] .haken.frisch .haken-box { animation: plopp var(--dur) var(--ease-pop); }
@keyframes plopp { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
[data-stil="level"] .art { padding: 0 var(--s1); border: 1px solid var(--linie); border-radius: var(--radius); line-height: 1.6; margin-top: 2px; }
[data-stil="level"] .koennen li::before { content: ""; top: .62em; left: .25em; width: 5px; height: 5px; border-radius: 50%; background: var(--blass); }
[data-stil="level"] .knopf.primaer:hover, [data-stil="level"] .knopf.primaer.ist-hover { box-shadow: 0 0 24px -4px var(--glut); transform: translateY(-1px); }
[data-stil="level"] .knopf:active, [data-stil="level"] .knopf.ist-aktiv { transform: scale(.96); }
[data-stil="level"] .karte, [data-stil="level"] .bk { border-color: transparent; }
[data-stil="level"] .bloecke { gap: var(--s2); }
[data-stil="level"] .bk-inhalt { border-top-color: var(--bg); }
[data-stil="level"] .bk-seite { border-left: 0; margin: 0 var(--s2) var(--s2) 0; border-radius: var(--radius); background: var(--bg); }
[data-stil="level"] .okopf-marke { border-color: transparent; background: var(--akzent); color: var(--akzent-tinte); }
[data-stil="level"] .bk[data-fertig] .bk-status { box-shadow: 0 0 12px var(--glut); animation: plopp var(--dur) var(--ease-pop); }
[data-stil="level"] .wdh-knopf[aria-pressed="true"] { box-shadow: 0 0 16px -4px var(--glut); }
[data-stil="level"] .wdh-knopf.frisch { animation: plopp var(--dur) var(--ease-pop); }
[data-stil="level"] .ki.wechsel { transform: translateX(12px); }
[data-stil="level"] .rang-chip { padding: 4px var(--s2) 4px 4px; border-radius: 999px; background: var(--flaeche); color: var(--text); font-weight: 600; }
[data-stil="level"] .rang-chip .mini-hex { display: grid; place-items: center; width: 22px; height: 22px; background: var(--akzent); color: var(--akzent-tinte); font-size: 11px; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
[data-stil="level"] .abz-ring { display: none; }
[data-stil="level"] .abz-form { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: var(--linie); }
[data-stil="level"] .abz-erreicht .abz-form { background: var(--akzent-hauch); color: var(--akzent); }
[data-stil="level"] .abz-aktuell .abz-form { background: var(--akzent); color: var(--akzent-tinte); }
[data-stil="level"] .abz-aktuell { filter: drop-shadow(0 0 14px var(--glut)); }
[data-stil="level"] .abz-gesperrt .abz-form { background: var(--flaeche); outline: 1px solid var(--linie); }
[data-stil="level"] .abz-gesperrt .abz-nr { display: none; }
[data-stil="level"] .abz-gesperrt .abz-schloss { display: block; width: 18px; height: 18px; }
[data-stil="level"] .moment-karte { transform: scale(.9); transition-timing-function: var(--ease-pop); }
[data-stil="level"] .moment[data-offen="true"] .moment-karte { transform: none; }
[data-stil="level"] .moment[data-offen="true"] .abz-gross { animation: hochploppen calc(var(--dur) * 2) var(--ease-pop) var(--dur) both; }
@keyframes hochploppen { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.funken i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--c); opacity: 0; animation: funke calc(var(--dur) * 4) cubic-bezier(.1,.7,.3,1) var(--verz) forwards; }
@keyframes funke { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); } }
.plus { position: absolute; pointer-events: none; font-size: var(--fs-1); font-weight: 700; color: var(--akzent); animation: aufsteigen calc(var(--dur) * 3) var(--ease) forwards; }
@keyframes aufsteigen { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-24px); } }

/* ---------- Entwurfsleiste (gehört nicht zum Design) ---------- */
.entwurf {
  position: fixed; left: calc(50% + var(--leiste-b) / 2); bottom: 16px; transform: translateX(-50%); z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; max-width: calc(100vw - 32px);
  padding: 6px; background: #26272b; border: 1px solid #3b3c42; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #c9cad0;
}
.entwurf-name { padding-left: 8px; color: #8b8d96; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.entwurf-gruppe { display: flex; gap: 2px; padding: 2px; background: #1b1c1f; border-radius: 16px; }
.entwurf button { padding: 6px 12px; border-radius: 14px; color: #b7b9c1; transition: background-color 150ms, color 150ms; }
.entwurf button:hover { color: #fff; }
.entwurf button[aria-pressed="true"] { background: #3d3f46; color: #fff; }
.entwurf button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

/* ---------- Schmale Fenster: Leiste wandert nach oben ---------- */
@media (max-width: 960px) {
  .bk-inhalt { grid-template-columns: minmax(0, 1fr); }
  .bk-seite, [data-stil="level"] .bk-seite { border-left: 0; border-top: 1px solid var(--linie); margin: 0; }
  .ordner-tabs-rahmen { overflow-x: auto; }
  .ordner-tabs { grid-template-columns: repeat(8, 9.5rem); }
}
@media (max-width: 760px) {
  :root { --leiste-b: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .leiste { height: auto; flex-direction: row; align-items: center; gap: var(--s1); padding: var(--s1) 16px; border-right: 0; border-bottom: 1px solid var(--linie); }
  .pruefung-knopf { padding: 0 var(--s1); }
  .nav { flex-direction: row; flex: 1; justify-content: flex-end; gap: 2px; }
  .nav-punkt { padding: 6px; }
  .nav-punkt span { display: none; }
  .haupt { padding: var(--s5) 16px 200px; }
  .raenge { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: var(--s3); }
  .zwei { grid-template-columns: minmax(0, 1fr); }
  .bk-lk { display: none; }
  .bk-kopf { grid-template-columns: 20px minmax(0, 1fr) auto 40px; padding-left: var(--s2); }
  .bk-liste { padding-left: var(--s2); }
  .entwurf .lang, .entwurf-name { display: none; }
  .entwurf { flex-wrap: nowrap; }
}

@media (prefers-reduced-motion: reduce) {
  :root[data-stil] { --dur: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  .funken { display: none; }
}
</style>
</head>
<body>
<div class="app" lang="de">
  <aside class="leiste" aria-label="Hauptnavigation">
    <div class="pruefung">
      <button class="pruefung-knopf" id="pruefung-knopf" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="pruefung-menue" aria-label="Prüfung wählen, aktuell AP1">
        AP1<span class="pfeil" aria-hidden="true"></span>
      </button>
      <div class="pruefung-menue" id="pruefung-menue" data-offen="false" role="menu" aria-label="Prüfung">
        <button class="pm-punkt" type="button" role="menuitemradio" aria-checked="true" style="--c: var(--akzent)">
          <span class="pm-farbe"></span><span><span class="pm-name">AP1</span><span class="pm-titel">Einrichten eines IT-gestützten Arbeitsplatzes</span></span>
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <button class="pm-punkt" type="button" role="menuitemradio" aria-checked="false" style="--c: var(--ap2)">
          <span class="pm-farbe"></span><span><span class="pm-name">AP2</span><span class="pm-titel">Fachprüfungen</span></span><span></span>
        </button>
        <button class="pm-punkt" type="button" role="menuitemradio" aria-checked="false" style="--c: var(--wiso)">
          <span class="pm-farbe"></span><span><span class="pm-name">WiSo</span><span class="pm-titel">Wirtschafts- und Sozialkunde</span></span><span></span>
        </button>
        <p class="pm-hinweis">Im Entwurf nur zur Ansicht. Die Farbpunkte zeigen die späteren Akzente.</p>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-punkt" role="link" aria-disabled="true" title="Kommt später">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5z"/></svg><span>Start</span>
      </a>
      <a class="nav-punkt" href="#" id="nav-lernen" aria-current="page">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3.5 5.5c2.8-1 5.6-1 8.5.8v13c-2.9-1.8-5.7-1.8-8.5-.8z"/><path d="M20.5 5.5c-2.8-1-5.6-1-8.5.8v13c2.9-1.8 5.7-1.8 8.5-.8z"/></svg><span>Lernen</span>
      </a>
      <a class="nav-punkt" role="link" aria-disabled="true" title="Kommt später">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01"/></svg><span>Üben</span>
      </a>
      <a class="nav-punkt" role="link" aria-disabled="true" title="Kommt später">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-5.2-5.2"/></svg><span>Nachschlagen</span>
      </a>
    </nav>
  </aside>

  <main class="haupt">
    <div class="spalte" id="ansicht-lernen"></div>
    <div class="spalte" id="ansicht-bausteine" hidden></div>
  </main>
</div>

<div class="moment" id="moment" data-offen="false" role="dialog" aria-modal="true" aria-labelledby="moment-titel">
  <div class="moment-karte" id="moment-karte" tabindex="-1"></div>
</div>
<div class="hinweis" id="hinweis" role="status" aria-live="polite" data-offen="false"></div>

<div class="entwurf" role="toolbar" aria-label="Entwurf: Ansicht und Stilrichtung">
  <span class="entwurf-name">Entwurf</span>
  <div class="entwurf-gruppe" role="group" aria-label="Ansicht">
    <button type="button" data-ansicht="lernen">Lernseite</button>
    <button type="button" data-ansicht="bausteine">Bausteine</button>
  </div>
  <div class="entwurf-gruppe" role="group" aria-label="Stilrichtung">
    <button type="button" data-stil="notizbuch">A<span class="lang"> · Notizbuch</span></button>
    <button type="button" data-stil="konsole">B<span class="lang"> · Konsole</span></button>
    <button type="button" data-stil="level">C<span class="lang"> · Level</span></button>
  </div>

<script>

  const von = Number(el.dataset.wert || 0);
  el.dataset.wert = ziel;
  const d = dauer() * (Math.abs(ziel - von) > 1 ? 3 : 1);
  if (!d || von === ziel) { el.textContent = ziel; return; }
  const t0 = performance.now();
  const schritt = (t) => {
    const k = Math.min(1, (t - t0) / d);
    el.textContent = Math.round(von + (ziel - von) * (1 - Math.pow(1 - k, 3)));
    if (k < 1 && el.dataset.wert == ziel) requestAnimationFrame(schritt);
  };
  requestAnimationFrame(schritt);
}

function setzeAnteil(el, p) {
  if (!el) return;
  const alt = parseFloat(el.style.getPropertyValue("--p")) || 0;
  el.style.setProperty("--p", p);
  if (stil === "level" && p > alt) { el.classList.remove("glanz"); void el.offsetWidth; el.classList.add("glanz"); }
}

function schalteWdh(btn) {

  zaehle($("#gesamt-zahl"), Z.erledigt.size);

  D.ordner.forEach((o) => {

    if (tab) { setzeAnteil($(".balken", tab), f / ids.length); tab.toggleAttribute("data-fertig", f === ids.length); }

      $$(`[data-block="${b.id}"]`).forEach((k) => {

}

function zufall(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function aktivitaet() {
  const wochen = 20, r = zufall(12);
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const wt = (heute.getDay() + 6) % 7; // Montag = 0
  const start = new Date(heute); start.setDate(heute.getDate() - wt - (wochen - 1) * 7);
  let zellen = "", aktiv = 0, serie = 0, beste = 0;
  for (let i = 0; i < wochen * 7; i++) {
    const tag = new Date(start); tag.setDate(start.getDate() + i);
    if (tag > heute) { zellen += '<i style="visibility:hidden"></i>'; continue; }
    const dichte = 0.3 + 0.5 * (i / (wochen * 7));
    const anzahl = r() < dichte ? 1 + Math.floor(r() * r() * 9) : 0;
    const stufe = anzahl === 0 ? 0 : anzahl < 2 ? 1 : anzahl < 4 ? 2 : anzahl < 6 ? 3 : 4;
    if (anzahl) { aktiv++; serie++; beste = Math.max(beste, serie); } else serie = 0;
    const datum = tag.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    zellen += `<i data-s="${stufe}" title="${anzahl} Stichpunkte am ${datum}"${+tag === +heute ? ' class="heute"' : ""}></i>`;
  }
  return `<div class="stapel">
    <div class="scroll-x"><div class="aktiv" role="img" aria-label="Aktivität der letzten ${wochen} Wochen, Beispielwerte: ${aktiv} aktive Tage">
      <div class="aktiv-tage" aria-hidden="true"><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span></span></div>
      <div class="raster">${zellen}</div>
    </div></div>
    <div class="aktiv-fuss"><span>${aktiv} aktive Tage · längste Serie ${beste} Tage</span>
      <span class="legende">weniger&nbsp;<span class="raster" style="display:inline-flex;gap:3px"><i></i><i data-s="1"></i><i data-s="2"></i><i data-s="3"></i><i data-s="4"></i></span>&nbsp;mehr</span></div>
  </div>`;
}

/* ---------- Rangaufstieg ---------- */
let vorherFokus = null, logTimer = [];
function zeigeMoment(idx) {
  const m = $("#moment"), k = $("#moment-karte");
  logTimer.forEach(clearTimeout); logTimer = [];
  vorherFokus = document.activeElement;
  const kopf = `${abzeichen(idx + 1, RAENGE[idx], "aktuell", true)}
    <p class="eyebrow">Neuer Rang</p>
    <h2 id="moment-titel">${esc(RAENGE[idx])}</h2>
    <p class="moment-text">Rang ${idx + 1} von ${RAENGE.length}. Weiter so.</p>
    <button class="knopf primaer" type="button" data-demo="moment-zu">Weiter</button>`;

  if (stil === "konsole") {
    k.innerHTML = `<pre class="log" aria-hidden="true"></pre><div class="moment-ende" hidden>${kopf}</div>`;
    const zeilen = ["$ rang --pruefen", "punkte  50/50", `rang    ${nr(idx)} → ${nr(idx + 1)}`, `<b>» neuer rang: ${esc(RAENGE[idx].toLowerCase())}</b>`];
    const log = $(".log", k), ende = $(".moment-ende", k);
    const takt = ruhig.matches ? 0 : dauer() * 2;
    zeilen.forEach((z, i) => logTimer.push(setTimeout(() => { log.innerHTML += (i ? "\n" : "") + z; }, takt * (i + 1))));
    logTimer.push(setTimeout(() => { ende.hidden = false; $(".knopf", ende).focus(); }, takt * (zeilen.length + 1)));
    k.focus();
  } else {
    k.innerHTML = kopf + (stil === "level" ? '<div class="funken" aria-hidden="true"></div>' : "");
    if (stil === "level" && !ruhig.matches) {
      const f = $(".funken", k);
      for (let i = 0; i < 28; i++) {
        const w = (i / 28) * Math.PI * 2 + Math.random() * 0.3, r = 70 + Math.random() * 90;
        const el = document.createElement("i");
        el.style.cssText = `--dx:${Math.cos(w) * r}px;--dy:${Math.sin(w) * r}px;--verz:${dauer() * 1.5}ms;--c:${i % 3 ? "var(--akzent)" : "var(--text)"}`;
        f.appendChild(el);
      }
    }
    setTimeout(() => $(".knopf", k)?.focus(), 0);
  }
  m.dataset.offen = "true";
}
function schliesseMoment() {
  logTimer.forEach(clearTimeout);
  $("#moment").dataset.offen = "false";
  vorherFokus?.focus?.();
}

/* ---------- Schalter ---------- */
let hinweisTimer;
function hinweis(text) {
  const el = $("#hinweis");
  el.textContent = text;
  el.dataset.offen = "true";
  clearTimeout(hinweisTimer);
  hinweisTimer = setTimeout(() => (el.dataset.offen = "false"), 2200);
}

function setzeStil(neu) {
  stil = neu;
  root.dataset.stil = neu;
  $$(".entwurf [data-stil]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.stil === neu));
  renderLernen();
  renderBausteine();
  try { localStorage.setItem("entwurf-stil", neu); } catch (e) {}
}
function setzeAnsicht(neu) {
  ansicht = neu;
  $("#ansicht-lernen").hidden = neu !== "lernen";
  $("#ansicht-bausteine").hidden = neu !== "bausteine";
  $$(".entwurf [data-ansicht]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.ansicht === neu));
  $("#nav-lernen").toggleAttribute("aria-current", neu === "lernen");
  if (neu === "lernen") $("#nav-lernen").setAttribute("aria-current", "page");
  window.scrollTo(0, 0);
  try { localStorage.setItem("entwurf-ansicht", neu); } catch (e) {}
}

function menue(offen) {
  $("#pruefung-knopf").setAttribute("aria-expanded", offen);
  $("#pruefung-menue").dataset.offen = offen;
  if (offen) $("#pruefung-menue .pm-punkt").focus();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) { menue(false); return; }
  if (!t.closest(".pruefung")) menue(false);

  if (t.matches("[data-haken]")) return schalteHaken(t.dataset.haken, t);
  if (t.matches("[data-klapp]")) return klapp(t);
  if (t.matches("[data-waehle]")) return waehle(t);
  if (t.matches("[data-ot]")) return zeigeOrdner(t.dataset.ot);
  if (t.matches("[data-wdh]")) return schalteWdh(t);
  if (t.matches("[data-demo-haken]")) { const an = t.getAttribute("aria-checked") !== "true"; t.setAttribute("aria-checked", an); t.classList.toggle("frisch", an); if (an && stil === "level") plusEins(t); return; }
  if (t.matches("[data-spaeter]")) return hinweis(t.dataset.spaeter);
  if (t.matches(".entwurf [data-stil]")) return setzeStil(t.dataset.stil);
  if (t.matches(".entwurf [data-ansicht]")) return setzeAnsicht(t.dataset.ansicht);
  if (t.id === "pruefung-knopf") return menue(t.getAttribute("aria-expanded") !== "true");
  if (t.matches(".pm-punkt")) { menue(false); $("#pruefung-knopf").focus(); if (t.getAttribute("aria-checked") !== "true") hinweis("Der Wechsel zu " + $(".pm-name", t).textContent + " kommt später."); return; }
  if (t.matches(".nav-punkt")) { e.preventDefault(); if (t.id === "nav-lernen") setzeAnsicht("lernen"); return; }

  switch (t.dataset.demo) {
    case "plus": demo.stand = Math.min(98, demo.stand + 10); break;
    case "null": demo.stand = 0; break;
    case "moment": return zeigeMoment(demo.rang + 1 < RAENGE.length ? demo.rang + 1 : demo.rang);
    case "moment-zu": return schliesseMoment();
    case "punkte":
      demo.punkte = Math.min(50, demo.punkte + 4);
      zaehle($("#rang-zahl"), demo.punkte);
      setzeAnteil($("#rang-balken"), demo.punkte / 50);
      if (demo.punkte >= 50) setTimeout(() => {
        demo.rang++; demo.punkte = 0;
        zeigeMoment(demo.rang);
        $("#rang-bereich").outerHTML = rangBereich();
        $("#rang-weg").innerHTML = rangWeg();
      }, dauer() * 2);
      return;
    case "rang-reset":
      demo.rang = 2; demo.punkte = 42;
      $("#rang-bereich").outerHTML = rangBereich();
      $("#rang-weg").innerHTML = rangWeg();
      return;
    default: return;
  }
  zaehle($("#demo-zahl"), demo.stand);
  setzeAnteil($("#demo-balken"), demo.stand / 98);
});

$("#moment").addEventListener("click", (e) => { if (e.target.id === "moment") schliesseMoment(); });
document.addEventListener("animationend", (e) => {
  if (e.target.classList?.contains("haken-box")) e.target.parentElement.classList.remove("frisch");
  if (e.target.classList?.contains("wdh-knopf")) e.target.classList.remove("frisch");
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#moment").dataset.offen === "true") schliesseMoment();
  else if ($("#pruefung-knopf").getAttribute("aria-expanded") === "true") { menue(false); $("#pruefung-knopf").focus(); }
});

setzeStil(stil);
setzeAnsicht(ansicht);
</script>
</body>
</html>
