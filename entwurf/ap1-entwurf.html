<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP1 Lerntracker</title>
<style>
/* Aufbau: schmale Leiste links, eine Inhaltsspalte fester Breite (44rem), Gliederung über Abstand und Schriftgröße.
   Jede Stilrichtung setzt nur Tokens; alle Bausteine lesen ausschließlich diese Tokens. */
:root { color-scheme: dark; }

/* A · Notizbuch: zurückhaltend, Serifenschrift, Haarlinien, kaum Spiel */
:root, :root[data-stil="notizbuch"] {
  --font: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style", Georgia, serif;
  --fs-1: .875rem; --fs-2: 1rem; --fs-3: 1.25rem; --fs-4: 1.75rem;
  --lh: 1.6; --w-kopf: 600;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  --radius: 4px;
  --dur: 220ms; --ease: cubic-bezier(.2,.7,.2,1); --ease-pop: cubic-bezier(.2,.7,.2,1);
  --einzug: 40px; --haken: 18px; --balken: 2px;
  --bg: #15171a; --leiste: #111316; --flaeche: #1c1f23; --linie: #2b2f35; --hover: rgba(220,228,240,.035);
  --text: #e6e3dc; --gedaempft: #a1a5ad; --blass: #686d76;
  --akzent: #8fb3d9; --akzent-tinte: #0e1620; --akzent-hauch: rgba(143,179,217,.13); --glut: transparent;
  --ap2: #c4a3d6; --wiso: #a6c79a;
}
/* B · Konsole: Monospace, harte Kanten, Rasterschritte, mittleres Spiel */
:root[data-stil="konsole"] {
  --font: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", ui-monospace, monospace;
  --fs-1: .8125rem; --fs-2: .875rem; --fs-3: 1rem; --fs-4: 1.375rem;
  --lh: 1.6; --w-kopf: 700;
  --s1: 4px; --s2: 12px; --s3: 20px; --s4: 28px; --s5: 40px; --s6: 56px;
  --radius: 0px;
  --dur: 120ms; --ease: linear; --ease-pop: steps(3, end);
  --einzug: 32px; --haken: 16px; --balken: 8px;
  --bg: #0f100d; --leiste: #0b0c09; --flaeche: #171812; --linie: #2e3026; --hover: rgba(232,163,61,.06);
  --text: #e2dfcf; --gedaempft: #9d9a89; --blass: #67654f;
  --akzent: #e8a33d; --akzent-tinte: #1a1205; --akzent-hauch: rgba(232,163,61,.13); --glut: transparent;
  --ap2: #5fb6d9; --wiso: #d9786a;
}
/* C · Level: technische Grotesk, weiche Flächen, federnde Effekte, deutliches Spiel */
:root[data-stil="level"] {
  --font: Bahnschrift, "DIN Alternate", "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-1: .8125rem; --fs-2: .9375rem; --fs-3: 1.25rem; --fs-4: 2rem;
  --lh: 1.55; --w-kopf: 600;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 56px; --s6: 80px;
  --radius: 12px;
  --dur: 300ms; --ease: cubic-bezier(.22,.8,.24,1); --ease-pop: cubic-bezier(.34,1.56,.64,1);
  --einzug: 40px; --haken: 20px; --balken: 8px;
  --bg: #0f111a; --leiste: #0b0d14; --flaeche: #171a26; --linie: #272b3c; --hover: rgba(95,224,176,.05);
  --text: #eceef7; --gedaempft: #a3a8bf; --blass: #646a84;
  --akzent: #5fe0b0; --akzent-tinte: #052219; --akzent-hauch: rgba(95,224,176,.13); --glut: rgba(95,224,176,.45);
  --ap2: #ff8a78; --wiso: #ffcf5c;
}
:root { --kante: calc(var(--einzug) + var(--s2)); --leiste-b: 112px; }

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-2); line-height: var(--lh);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, p, ul { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
svg.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Rahmen ---------- */
.app { display: grid; grid-template-columns: var(--leiste-b) minmax(0, 1fr); min-height: 100vh; }
.leiste {
  position: sticky; top: 0; height: 100vh; z-index: 10;
  display: flex; flex-direction: column; gap: var(--s4);
  padding: var(--s3) var(--s1); background: var(--leiste); border-right: 1px solid var(--linie);
}
.nav { display: flex; flex-direction: column; gap: var(--s1); }
.nav-punkt {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: var(--s2) 4px; border-radius: var(--radius);
  color: var(--gedaempft); font-size: var(--fs-1); line-height: 1.2; text-decoration: none;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.nav-punkt:not([aria-disabled="true"]):hover { color: var(--text); background: var(--hover); }
.nav-punkt[aria-current="page"] { color: var(--text); background: var(--akzent-hauch); }
.nav-punkt[aria-current="page"] .ico { color: var(--akzent); }
.nav-punkt[aria-disabled="true"] { opacity: .36; cursor: not-allowed; }

/* Prüfungskennung oben links */
.pruefung { position: relative; }
.pruefung-knopf {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 40px;
  border-radius: var(--radius); color: var(--gedaempft); font-size: var(--fs-1); font-weight: 600; letter-spacing: .08em;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.pruefung-knopf:hover, .pruefung-knopf[aria-expanded="true"] { color: var(--text); background: var(--hover); }
.pruefung-knopf .pfeil { width: 16px; height: 16px; }
.pruefung-menue {
  position: absolute; top: calc(100% + var(--s1)); left: 0; z-index: 30;
  width: 20rem; max-width: calc(100vw - 32px); padding: var(--s1);
  display: grid; gap: 2px;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  box-shadow: 0 16px 40px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(-4px); visibility: hidden;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
}
.pruefung-menue[data-offen="true"] { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.pm-punkt {
  display: grid; grid-template-columns: 8px minmax(0, 1fr) 16px; align-items: center; gap: var(--s2);
  width: 100%; padding: var(--s1) var(--s2); border-radius: var(--radius);
  transition: background-color var(--dur) var(--ease);
}
.pm-punkt:hover { background: var(--hover); }
.pm-farbe { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pm-name { font-weight: 600; }
.pm-titel { display: block; font-size: var(--fs-1); color: var(--gedaempft); line-height: 1.35; }
.pm-punkt .ico { width: 16px; height: 16px; color: var(--akzent); }
.pm-hinweis { margin-top: 4px; padding: var(--s1) var(--s2) 4px; border-top: 1px solid var(--linie); font-size: var(--fs-1); color: var(--blass); }

/* ---------- Inhaltsspalte ---------- */
.haupt { min-width: 0; padding: var(--s6) var(--s4) 160px; }
.spalte { width: min(100%, 66rem); margin-inline: auto; }
.seitenkopf { display: grid; gap: var(--s2); padding-bottom: var(--s5); }
.eyebrow, .label { font-size: var(--fs-1); color: var(--gedaempft); }
.titel { font-size: var(--fs-4); line-height: 1.2; font-weight: var(--w-kopf); text-wrap: balance; }
.lead { color: var(--gedaempft); max-width: 60ch; }
.stand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s1) var(--s2); margin-top: var(--s1); font-size: var(--fs-1); color: var(--gedaempft); }
.zahl { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

/* Fortschrittsbalken */
.balken { position: relative; display: block; height: var(--balken); background: var(--linie); border-radius: var(--radius); overflow: hidden; }
.balken > i {
  position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 100%);
  background: var(--akzent); border-radius: inherit;
  transition: width var(--dur) var(--ease);
}

/* Ordner */
.ordner { border-top: 1px solid var(--linie); }
.ordner:last-child { border-bottom: 1px solid var(--linie); }
.ordner-kopf { font: inherit; }
.ordner-knopf {
  width: 100%; min-height: 56px; padding: var(--s3) 0;
  display: grid; grid-template-columns: var(--einzug) minmax(0, 1fr) auto 4rem 24px; align-items: center; column-gap: var(--s2);
}
.ordner-nr { position: relative; display: grid; place-items: start; color: var(--blass); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.ordner-nr .ico { display: none; width: 18px; height: 18px; color: var(--akzent); stroke-width: 2; }
.ordner[data-fertig] .nr-zahl { display: none; }
.ordner[data-fertig] .ordner-nr .ico { display: block; }
.ordner-titel { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; text-wrap: balance; }
.ordner-stand { font-size: var(--fs-1); color: var(--gedaempft); white-space: nowrap; }
.ordner-stand .zahl { font-weight: 400; }
.balken.mini { height: min(var(--balken), 4px); }
.ordner-knopf:hover .ordner-titel { color: var(--akzent); }
.ordner-titel { transition: color var(--dur) var(--ease); }

.block { display: grid; gap: var(--s1); padding-bottom: var(--s3); }
.block-titel { padding-left: var(--kante); }
.sp-liste { list-style: none; padding: 0; margin: 0; display: grid; }

/* Stichpunkt */
.sp-zeile {
  display: grid; grid-template-columns: var(--einzug) minmax(0, 1fr); align-items: start; column-gap: var(--s2);
  border-radius: var(--radius); transition: background-color var(--dur) var(--ease);
}
.sp-zeile:hover { background: var(--hover); }
.haken { display: flex; align-items: center; justify-content: flex-start; width: 100%; height: 40px; padding-left: 0; }
.haken-box {
  display: grid; place-items: center; width: var(--haken); height: var(--haken);
  border: 1.5px solid var(--blass); border-radius: min(var(--radius), calc(var(--haken) / 2));
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.haken-box svg { width: 100%; height: 100%; fill: none; stroke: var(--akzent-tinte); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.haken-box path { stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset var(--dur) var(--ease); }
.haken:hover .haken-box { border-color: var(--akzent); }
.haken[aria-checked="true"] .haken-box { background: var(--akzent); border-color: var(--akzent); }
.haken[aria-checked="true"] path { stroke-dashoffset: 0; transition-delay: calc(var(--dur) / 3); }
.haken:disabled .haken-box { border-color: var(--linie); background: var(--hover); }
.haken:disabled:hover .haken-box { border-color: var(--linie); }

.sp-knopf {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; align-items: start; column-gap: var(--s2);
  padding-block: calc((40px - var(--fs-2) * var(--lh)) / 2); padding-right: var(--s1); min-height: 40px;
}
.sp-titel { transition: color var(--dur) var(--ease); overflow-wrap: anywhere; }
.sp[data-erledigt] .sp-titel { color: var(--gedaempft); }
.art { font-size: var(--fs-1); color: var(--gedaempft); white-space: nowrap; line-height: calc(var(--fs-2) * var(--lh)); }
.pfeil { display: grid; place-items: center; width: 24px; height: calc(var(--fs-2) * var(--lh)); color: var(--blass); transition: transform var(--dur) var(--ease), color var(--dur) var(--ease); }
.pfeil::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
[aria-expanded="true"] > .pfeil { transform: rotate(180deg); color: var(--akzent); }
.ordner-knopf:hover .pfeil { color: var(--text); }
.zeiger { display: grid; place-items: center; width: 24px; height: calc(var(--fs-2) * var(--lh)); color: var(--blass); opacity: 0; transition: opacity var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.zeiger::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateX(-2px) rotate(-45deg); }
.sp-knopf:hover .zeiger, .sp-knopf:focus-visible .zeiger { opacity: 1; }
.sp[data-gewaehlt] .sp-zeile { background: var(--akzent-hauch); }
.sp[data-gewaehlt] .sp-titel { color: var(--text); }
.sp[data-gewaehlt] .zeiger { opacity: 1; color: var(--akzent); transform: translateX(2px); }

/* Aufklappen: schiebt den Rest weich nach unten */
.klapp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur) var(--ease); }
.klapp[data-offen="true"] { grid-template-rows: 1fr; }
.klapp-innen { min-height: 0; overflow: hidden; opacity: 0; transition: opacity var(--dur) var(--ease); }
.klapp[data-offen="true"] > .klapp-innen { opacity: 1; }

/* Liste links, Detailfeld rechts. Das Feld läuft beim Scrollen mit und hat eine feste Breite. */
.lern-raster { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; column-gap: var(--s5); align-items: start; }
.detail {
  position: sticky; top: var(--s4); max-height: calc(100vh - var(--s4) - 88px); overflow-y: auto; overscroll-behavior: contain;
  padding: 0 var(--s1) var(--s3) var(--s4); border-left: 1px solid var(--linie);
  font-size: var(--fs-1);
}
.detail .detail-zu { display: none; }
.detail-innen { display: grid; gap: var(--s3); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.detail-innen.wechsel { opacity: 0; transform: translateY(4px); }
.detail-kopf { display: grid; gap: var(--s1); }
.detail-titel { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.detail-meta { color: var(--gedaempft); }
.haken.mit-text { width: auto; justify-self: start; gap: var(--s1); height: 32px; font-size: var(--fs-1); color: var(--gedaempft); transition: color var(--dur) var(--ease); }
.haken.mit-text[aria-checked="true"] { color: var(--text); }
.feld { display: grid; gap: var(--s1); }
.koennen { list-style: none; padding: 0; display: grid; gap: var(--s1); }
.koennen li { position: relative; padding-left: 1.25em; }
.koennen li::before { content: "–"; position: absolute; left: 0; color: var(--blass); }
.aktionen { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Knöpfe: zwei Arten */
.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  min-height: 40px; padding: 0 var(--s3); border: 1px solid transparent; border-radius: var(--radius);
  font-size: var(--fs-1); font-weight: 600; white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease-pop);
}
.knopf.primaer { background: var(--akzent); color: var(--akzent-tinte); }
.knopf.primaer:hover, .knopf.primaer.ist-hover { background: color-mix(in srgb, var(--akzent) 84%, white); }
.knopf.primaer:active, .knopf.primaer.ist-aktiv { background: color-mix(in srgb, var(--akzent) 78%, black); transform: translateY(1px); }
.knopf.sekundaer { border-color: var(--linie); color: var(--text); }
.knopf.sekundaer:hover, .knopf.sekundaer.ist-hover { border-color: var(--gedaempft); background: var(--hover); }
.knopf.sekundaer:active, .knopf.sekundaer.ist-aktiv { background: var(--akzent-hauch); border-color: var(--akzent); transform: translateY(1px); }
.knopf:disabled, .knopf:disabled:hover { background: transparent; border-color: var(--linie); color: var(--blass); transform: none; box-shadow: none; }
.knopf.primaer:disabled { background: var(--linie); border-color: var(--linie); }
.ist-hover, .ist-aktiv { pointer-events: none; }

/* Karte: die eine Art Karte */
.karte { display: grid; gap: var(--s2); max-width: 32rem; padding: var(--s3); background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); }
.karte-titel { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; text-wrap: balance; }
.karte-meta { font-size: var(--fs-1); color: var(--gedaempft); }

/* Rang-Chip im Kopf (nur Konsole und Level) */
.rang-chip { display: inline-flex; align-items: center; gap: var(--s1); color: var(--gedaempft); }

/* ---------- Bausteine-Seite ---------- */
.bs { display: grid; gap: var(--s3); padding-block: var(--s5); border-top: 1px solid var(--linie); }
.bs-kopf { display: grid; gap: var(--s1); }
.bs h2 { font-size: var(--fs-3); font-weight: var(--w-kopf); line-height: 1.3; }
.bs-text { font-size: var(--fs-1); color: var(--gedaempft); max-width: 60ch; }
.zustand-name { font-size: var(--fs-1); color: var(--blass); }
.scroll-x { overflow-x: auto; }
.knopf-raster { display: grid; grid-template-columns: 6rem repeat(4, minmax(7.5rem, 1fr)); gap: var(--s2); align-items: center; min-width: 38rem; }
.muster-reihe { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); }
.muster { display: flex; align-items: center; gap: var(--s1); }
.muster .haken { width: auto; }
.zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.stapel { display: grid; gap: var(--s2); }
.leer { display: grid; justify-items: start; align-content: start; gap: var(--s1); padding: var(--s3); border: 1px dashed var(--linie); border-radius: var(--radius); }
.leer .ico { width: 24px; height: 24px; color: var(--blass); margin-bottom: var(--s1); }
.leer-titel { font-weight: 600; }
.leer-text { font-size: var(--fs-1); color: var(--gedaempft); }
.gesperrt { color: var(--blass); }
.gesperrt .leer-titel { color: var(--gedaempft); }
.gesperrt { border-style: solid; background: var(--hover); }

/* Rangabzeichen */
.raenge { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s2); }
.abz { display: grid; justify-items: center; align-content: start; gap: var(--s1); text-align: center; }
.abz-form { position: relative; display: grid; place-items: center; width: 56px; height: 56px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gedaempft); }
.abz-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); fill: none; stroke-width: 1.5; }
.abz-ring .grund { stroke: var(--linie); }
.abz-ring .voll { stroke: var(--akzent); stroke-dasharray: 145; stroke-dashoffset: 145; }
.abz-erreicht .abz-ring .voll, .abz-aktuell .abz-ring .voll { stroke-dashoffset: 0; }
.abz-erreicht .abz-form { color: var(--text); }
.abz-aktuell .abz-form { color: var(--akzent); }
.abz-gesperrt .abz-ring .grund { stroke-dasharray: 3 4; }
.abz-gesperrt .abz-form { color: var(--blass); }
.abz-schloss { display: none; }
.abz-name { font-size: var(--fs-1); color: var(--gedaempft); line-height: 1.3; overflow-wrap: anywhere; }
.abz-aktuell .abz-name { color: var(--text); font-weight: 600; }
.abz-gesperrt .abz-name { color: var(--blass); }
.abz-gross .abz-form { width: 96px; height: 96px; font-size: var(--fs-4); }

.rang-weg { display: grid; gap: var(--s1); }

/* Aktivitätsübersicht */
.aktiv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s1); }
.aktiv-tage { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; font-size: var(--fs-1); line-height: 14px; color: var(--blass); }
.raster { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
.raster i { border-radius: calc(var(--radius) / 4); background: var(--linie); }
.raster i[data-s="1"] { background: color-mix(in srgb, var(--akzent) 30%, var(--linie)); }
.raster i[data-s="2"] { background: color-mix(in srgb, var(--akzent) 55%, var(--linie)); }
.raster i[data-s="3"] { background: color-mix(in srgb, var(--akzent) 80%, var(--linie)); }
.raster i[data-s="4"] { background: var(--akzent); }
.raster i.heute { outline: 1px solid var(--text); outline-offset: 1px; }
.aktiv-fuss { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s1) var(--s3); font-size: var(--fs-1); color: var(--gedaempft); }
.legende { display: inline-flex; align-items: center; gap: 3px; }
.legende i { width: 14px; height: 14px; }

/* Besonderer Moment */
.moment {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
  background: rgba(4, 5, 8, .74);
  opacity: 0; visibility: hidden; transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur);
}
.moment[data-offen="true"] { opacity: 1; visibility: visible; transition-delay: 0s; }
.moment-karte {
  position: relative; width: min(100%, 24rem); display: grid; justify-items: center; gap: var(--s2); text-align: center;
  padding: var(--s5) var(--s4) var(--s4); background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  transform: translateY(8px); transition: transform var(--dur) var(--ease);
}
.moment[data-offen="true"] .moment-karte { transform: none; }
.moment-karte .knopf { margin-top: var(--s2); }
.moment .abz-ring .voll { stroke-dashoffset: 145; }
.moment[data-offen="true"] .abz-ring .voll { animation: ring calc(var(--dur) * 4) var(--ease) calc(var(--dur)) forwards; }
@keyframes ring { to { stroke-dashoffset: 0; } }
.moment h2 { font-size: var(--fs-4); font-weight: var(--w-kopf); line-height: 1.2; }
.moment-text { color: var(--gedaempft); font-size: var(--fs-1); }
.log { display: none; }
.funken { position: absolute; left: 50%; top: calc(var(--s5) + 48px); width: 0; height: 0; pointer-events: none; }

/* Hinweis unten */
.hinweis {
  position: fixed; left: calc(50% + var(--leiste-b) / 2); bottom: 84px; z-index: 40;
  max-width: calc(100vw - 32px); padding: var(--s1) var(--s2);
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  font-size: var(--fs-1); color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.4);
  opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.hinweis[data-offen="true"] { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Stilrichtung A · Notizbuch ---------- */
[data-stil="notizbuch"] .eyebrow, [data-stil="notizbuch"] .label { font-size: var(--fs-2); font-variant-caps: all-small-caps; letter-spacing: .07em; }
[data-stil="notizbuch"] .art { font-style: italic; }
[data-stil="notizbuch"] .rang-chip { display: none; }

/* ---------- Stilrichtung B · Konsole ---------- */
[data-stil="konsole"] .label, [data-stil="konsole"] .eyebrow { text-transform: lowercase; }
[data-stil="konsole"] .label::before { content: "// "; color: var(--blass); }
[data-stil="konsole"] .titel::after { content: "▍"; margin-left: .15em; color: var(--akzent); font-weight: 400; animation: blinken 1s steps(1) 4; }
@keyframes blinken { 50% { opacity: 0; } }
[data-stil="konsole"] .ordner { border-top-style: dashed; }
[data-stil="konsole"] .ordner:last-child { border-bottom-style: dashed; }
[data-stil="konsole"] .balken, [data-stil="konsole"] .balken > i { background: repeating-linear-gradient(90deg, var(--linie) 0 6px, transparent 6px 8px); }
[data-stil="konsole"] .balken > i { background: repeating-linear-gradient(90deg, var(--akzent) 0 6px, transparent 6px 8px); transition-timing-function: steps(6, end); }
[data-stil="konsole"] .balken.mini { height: 4px; }
[data-stil="konsole"] .pfeil::before { content: "+"; width: auto; height: auto; border: 0; transform: none; }
[data-stil="konsole"] [aria-expanded="true"] > .pfeil { transform: none; }
[data-stil="konsole"] [aria-expanded="true"] > .pfeil::before { content: "−"; }
[data-stil="konsole"] .haken-box path { transition-timing-function: steps(4, end); }
[data-stil="konsole"] .art::before { content: "#"; }
[data-stil="konsole"] .art { text-transform: lowercase; }
[data-stil="konsole"] .koennen li::before { content: ">"; color: var(--akzent); }
[data-stil="konsole"] .knopf.sekundaer::before { content: "["; color: var(--blass); }
[data-stil="konsole"] .knopf.sekundaer::after { content: "]"; color: var(--blass); }
[data-stil="konsole"] .knopf.primaer:active, [data-stil="konsole"] .knopf.ist-aktiv { transform: translate(1px, 1px); }
[data-stil="konsole"] .rang-chip { color: var(--gedaempft); }
[data-stil="konsole"] .rang-chip b { color: var(--akzent); font-weight: 400; }
[data-stil="konsole"] .sp-zeile:hover, [data-stil="konsole"] .sp[data-gewaehlt] .sp-zeile { box-shadow: inset 2px 0 0 var(--akzent); }
[data-stil="konsole"] .zeiger::before { content: ">"; width: auto; height: auto; border: 0; transform: none; }
[data-stil="konsole"] .detail { border-left-style: dashed; }
[data-stil="konsole"] .detail-innen.wechsel { transform: none; }
[data-stil="konsole"] .abz-ring { display: none; }
[data-stil="konsole"] .abz-form { border: 1px solid var(--linie); }
[data-stil="konsole"] .abz-erreicht .abz-form { border-color: var(--gedaempft); }
[data-stil="konsole"] .abz-aktuell .abz-form { border-color: var(--akzent); background: var(--akzent); color: var(--akzent-tinte); }
[data-stil="konsole"] .abz-gesperrt .abz-form { border-style: dashed; }
[data-stil="konsole"] .moment-karte { justify-items: start; text-align: left; }
[data-stil="konsole"] .moment .abz-form { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-tinte); }
[data-stil="konsole"] .log { display: block; margin: 0; width: 100%; font: inherit; font-size: var(--fs-1); color: var(--gedaempft); white-space: pre-wrap; min-height: calc(5 * var(--fs-1) * 1.6); }
[data-stil="konsole"] .log b { color: var(--akzent); font-weight: 400; }
[data-stil="konsole"] .moment-ende { display: grid; gap: var(--s2); justify-items: start; }
[data-stil="konsole"] .moment-ende[hidden] { display: none; }

/* ---------- Stilrichtung C · Level ---------- */
[data-stil="level"] .eyebrow, [data-stil="level"] .label { text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
[data-stil="level"] .ordner-liste { display: grid; gap: var(--s2); }
[data-stil="level"] .ordner, [data-stil="level"] .ordner:last-child { border: 0; background: var(--flaeche); border-radius: var(--radius); padding-inline: var(--s3); }
[data-stil="level"] .ordner-knopf { padding-block: var(--s3); }
[data-stil="level"] .ordner-nr { place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--linie); color: var(--gedaempft); font-weight: 600; transition: background-color var(--dur) var(--ease); }
[data-stil="level"] .ordner[data-fertig] .ordner-nr { background: var(--akzent); }
[data-stil="level"] .ordner[data-fertig] .ordner-nr .ico { color: var(--akzent-tinte); animation: plopp var(--dur) var(--ease-pop); }
[data-stil="level"] .balken > i { box-shadow: 0 0 12px var(--glut); }
[data-stil="level"] .balken > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); }
[data-stil="level"] .balken.glanz > i::after { animation: glanz calc(var(--dur) * 3) var(--ease); }
@keyframes glanz { to { transform: translateX(100%); } }
[data-stil="level"] .haken.frisch .haken-box { animation: plopp var(--dur) var(--ease-pop); }
@keyframes plopp { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
[data-stil="level"] .art { padding: 0 var(--s1); border: 1px solid var(--linie); border-radius: var(--radius); line-height: 1.6; margin-top: 2px; }
[data-stil="level"] .koennen li::before { content: ""; top: .62em; left: .25em; width: 5px; height: 5px; border-radius: 50%; background: var(--blass); }
[data-stil="level"] .knopf.primaer:hover, [data-stil="level"] .knopf.primaer.ist-hover { box-shadow: 0 0 24px -4px var(--glut); transform: translateY(-1px); }
[data-stil="level"] .knopf:active, [data-stil="level"] .knopf.ist-aktiv { transform: scale(.96); }
[data-stil="level"] .karte { border-color: transparent; }
[data-stil="level"] .detail { border: 0; padding: var(--s3); background: var(--flaeche); border-radius: var(--radius); }
[data-stil="level"] .detail-innen.wechsel { transform: translateX(12px); }
[data-stil="level"] .rang-chip { padding: 4px var(--s2) 4px 4px; border-radius: 999px; background: var(--flaeche); color: var(--text); font-weight: 600; }
[data-stil="level"] .rang-chip .mini-hex { display: grid; place-items: center; width: 22px; height: 22px; background: var(--akzent); color: var(--akzent-tinte); font-size: 11px; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
[data-stil="level"] .abz-ring { display: none; }
[data-stil="level"] .abz-form { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: var(--linie); }
[data-stil="level"] .abz-erreicht .abz-form { background: var(--akzent-hauch); color: var(--akzent); }
[data-stil="level"] .abz-aktuell .abz-form { background: var(--akzent); color: var(--akzent-tinte); }
[data-stil="level"] .abz-aktuell { filter: drop-shadow(0 0 14px var(--glut)); }
[data-stil="level"] .abz-gesperrt .abz-form { background: var(--flaeche); outline: 1px solid var(--linie); }
[data-stil="level"] .abz-gesperrt .abz-nr { display: none; }
[data-stil="level"] .abz-gesperrt .abz-schloss { display: block; width: 18px; height: 18px; }
[data-stil="level"] .moment-karte { transform: scale(.9); transition-timing-function: var(--ease-pop); }
[data-stil="level"] .moment[data-offen="true"] .moment-karte { transform: none; }
[data-stil="level"] .moment[data-offen="true"] .abz-gross { animation: hochploppen calc(var(--dur) * 2) var(--ease-pop) var(--dur) both; }
@keyframes hochploppen { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.funken i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--c); opacity: 0; animation: funke calc(var(--dur) * 4) cubic-bezier(.1,.7,.3,1) var(--verz) forwards; }
@keyframes funke { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); } }
.plus { position: absolute; pointer-events: none; font-size: var(--fs-1); font-weight: 700; color: var(--akzent); animation: aufsteigen calc(var(--dur) * 3) var(--ease) forwards; }
@keyframes aufsteigen { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-24px); } }

/* ---------- Entwurfsleiste (gehört nicht zum Design) ---------- */
.entwurf {
  position: fixed; left: calc(50% + var(--leiste-b) / 2); bottom: 16px; transform: translateX(-50%); z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; max-width: calc(100vw - 32px);
  padding: 6px; background: #26272b; border: 1px solid #3b3c42; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #c9cad0;
}
.entwurf-name { padding-left: 8px; color: #8b8d96; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.entwurf-gruppe { display: flex; gap: 2px; padding: 2px; background: #1b1c1f; border-radius: 16px; }
.entwurf button { padding: 6px 12px; border-radius: 14px; color: #b7b9c1; transition: background-color 150ms, color 150ms; }
.entwurf button:hover { color: #fff; }
.entwurf button[aria-pressed="true"] { background: #3d3f46; color: #fff; }
.entwurf button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

/* ---------- Schmale Fenster: Leiste wandert nach oben ---------- */
@media (max-width: 960px) {
  .lern-raster { grid-template-columns: minmax(0, 1fr); }
  .detail, [data-stil="level"] .detail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 45; max-height: 72vh;
    padding: var(--s3) 16px 96px; background: var(--flaeche); border: 0; border-top: 1px solid var(--linie);
    border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -16px 40px rgba(0,0,0,.45);
    transform: translateY(100%); visibility: hidden;
    transition: transform var(--dur) var(--ease), visibility 0s linear var(--dur);
  }
  .detail[data-offen="true"] { transform: none; visibility: visible; transition-delay: 0s; }
  .detail .detail-zu { display: flex; width: max-content; margin: 0 0 var(--s2) auto; min-height: 32px; padding: 0 var(--s2); }
}
@media (max-width: 760px) {
  :root { --leiste-b: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .leiste { height: auto; flex-direction: row; align-items: center; gap: var(--s1); padding: var(--s1) 16px; border-right: 0; border-bottom: 1px solid var(--linie); }
  .pruefung-knopf { padding: 0 var(--s1); }
  .nav { flex-direction: row; flex: 1; justify-content: flex-end; gap: 2px; }
  .nav-punkt { padding: 6px; }
  .nav-punkt span { display: none; }
  .haupt { padding: var(--s5) 16px 200px; }
  .ordner-knopf { grid-template-columns: var(--einzug) minmax(0, 1fr) auto 24px; }
  .ordner-knopf .balken.mini { display: none; }
  .raenge { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: var(--s3); }
  .zwei { grid-template-columns: minmax(0, 1fr); }
  [data-stil="level"] .ordner, [data-stil="level"] .ordner:last-child { padding-inline: var(--s1); }
  .entwurf .lang, .entwurf-name { display: none; }
  .entwurf { flex-wrap: nowrap; }
}

@media (prefers-reduced-motion: reduce) {
  :root[data-stil] { --dur: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
  .funken { display: none; }
}
</style>
</head>

<script>
const D = {"teil":"AP1","titel":"Einrichten eines IT-gestützten Arbeitsplatzes","ordner":[{"id":"AP1-1","titel":"Projektmanagement und Qualität","bloecke":[{"id":"AP1-1-1","titel":"Projektgrundlagen","stichpunkte":[{"id":"AP1-1-1-1","titel":"Projektmerkmale und SMART-Ziele","art":"Wissen","rahmen":"Du grenzt ein Projekt von einer Daueraufgabe ab und formulierst Projektziele sauber. Das Thema beginnt bei den Merkmalen eines Projektes und reicht bis zur Anwendung der SMART-Kriterien auf gegebene Aussagen. In der Prüfung 2026 waren Beschreibungen eines Projektes dem passenden SMART-Kriterium zuzuordnen; die fünf Begriffe standen dabei.","koennen":["Du kannst Merkmale eines Projektes nennen und an einem Beispiel entscheiden, ob ein Projekt vorliegt.","Du kennst als typische Merkmale: einmalig, zeitlich begrenzt, klares Ziel, begrenzte Mittel, eigenes Team.","Du kannst die fünf SMART-Kriterien nennen: spezifisch, messbar, akzeptiert, realistisch, terminiert.","Du kannst eine Zielbeschreibung dem passenden SMART-Kriterium zuordnen.","Du kannst ein unscharfes Ziel so umformulieren, dass es alle fünf Kriterien erfüllt."]},{"id":"AP1-1-1-2","titel":"Vorgehen im Projekt: Wasserfallmodell und Scrum","art":"Wissen","rahmen":"Der Katalog verlangt, die Projektphasen am Beispiel des Wasserfallmodells bzw. von Scrum definieren zu können. Für AP1 reicht das Grundprinzip beider Vorgehensweisen mit Phasen, Vorteilen und Nachteilen. Weitere Modelle (V-Modell, Spiralmodell) und die begründete Auswahl für ein Softwareprojekt nennt der AP1-Katalog nicht.","koennen":["Du kannst die Phasen des Wasserfallmodells in der richtigen Reihenfolge nennen und erklären, dass eine Phase abgeschlossen wird, bevor die nächste beginnt.","Du kannst je einen Vorteil und einen Nachteil des Wasserfallmodells beschreiben.","Du kannst den Ablauf von Scrum beschreiben: Arbeit in kurzen, gleich langen Sprints, an deren Ende ein nutzbares Zwischenergebnis steht.","Du kannst die Rollen Product Owner, Scrum Master und Entwicklungsteam sowie die Begriffe Product Backlog, Sprint Planning, Daily, Review und Retrospektive erklären.","Du kannst begründen, wann ein planbasiertes und wann ein agiles Vorgehen besser passt."]},{"id":"AP1-1-1-3","titel":"Stakeholder und Risikoanalyse","art":"Wissen","rahmen":"Du beurteilst, wer Einfluss auf ein Projekt hat und was schiefgehen kann. Der Katalog führt beides unter „Machbarkeit und Wirtschaftlichkeit von Projekten beurteilen\". Für AP1 genügt es, Stakeholder zu benennen und ihren Einfluss einzuschätzen sowie Risiken mit Auswirkung und Gegenmaßnahme zu beschreiben. In den beiden AP1-Prüfungen nach aktuellem Katalog war das Thema nicht dran.","koennen":["Du kannst erklären, was ein Stakeholder ist, und für ein Projekt Stakeholder nennen.","Du kannst den Einfluss eines Stakeholders auf ein Projekt beurteilen.","Du kannst Stakeholder nach Einfluss und Interesse einordnen und daraus ableiten, wen du eng einbindest.","Du kannst für ein Projekt Risiken benennen.","Du kannst ein Risiko nach Eintrittswahrscheinlichkeit und Schadenshöhe bewerten und eine Gegenmaßnahme vorschlagen."]},{"id":"AP1-1-1-4","titel":"Teamphasen und Reflexion: Feedback, Lessons Learned","art":"Wissen","rahmen":"Der Katalog verlangt, die Phasen der Teambildung und -entwicklung sowie Reflexionsmethoden zu kennen. Es bleibt beim Kennen und Zuordnen: Phasen benennen, eine beschriebene Situation einordnen, den Zweck von Feedback und Lessons Learned erklären. Belege aus Prüfungen nach aktuellem Katalog gibt es nicht.","koennen":["Du kannst die Phasen der Teambildung und -entwicklung nennen.","Du kennst das Phasenmodell nach Tuckman (Forming, Storming, Norming, Performing, Adjourning) und kannst eine beschriebene Teamsituation einer Phase zuordnen.","Du kannst erklären, was Lessons Learned sind und wozu sie am Ende eines Projektes oder Auftrags festgehalten werden.","Du kannst erklären, was eine Feedback-Kultur ist.","Du kannst Regeln für konstruktives Feedback nennen: konkret, zeitnah, auf das Verhalten bezogen, als Ich-Botschaft."]}]},{"id":"AP1-1-2","titel":"Projektplanung und Termine","stichpunkte":[{"id":"AP1-1-2-1","titel":"Projektstrukturplan und Gantt-Diagramm","art":"Zeichnen","rahmen":"Der Katalog nennt Strukturplan und Gantt-Diagramm neben dem Netzplan als Werkzeuge der Projektplanung, die du anwenden können sollst. Für AP1 heißt das: ein Projekt in Teilaufgaben und Arbeitspakete gliedern und Vorgänge mit Dauer und Abhängigkeiten als Balken in ein Zeitraster eintragen oder daraus ablesen. In den Prüfungen nach aktuellem Katalog kam bisher nur der Netzplan vor.","koennen":["Du kannst ein Projekt in einem Projektstrukturplan in Teilaufgaben und Arbeitspakete gliedern.","Du kannst Vorgänge mit Dauer und Vorgängern als Balken in ein Gantt-Diagramm eintragen.","Du kannst aus einem Gantt-Diagramm Projektdauer, parallele Vorgänge und Meilensteine ablesen.","Du kannst den Unterschied erklären: Der Projektstrukturplan zeigt, was zu tun ist; das Gantt-Diagramm zeigt, wann es getan wird."]},{"id":"AP1-1-2-2","titel":"Netzplan: Zeiten, Puffer und kritischen Weg berechnen","art":"Rechnen","rahmen":"Du berechnest für einen Netzplan die frühesten und spätesten Zeitpunkte, die Puffer und den kritischen Weg. Der Anhang des Katalogs legt den Aufbau des Vorgangsknotens und die Formeln fest. In der Prüfung Frühjahr 2025 war ein teilweise ausgefüllter Netzplan mit zehn Vorgängen zu vervollständigen; Vorgangsliste, Legende und Pufferformeln standen dabei. Einen Netzplan vollständig selbst zu zeichnen war dort nicht verlangt.","koennen":["Du kannst den frühesten Anfangszeitpunkt (FAZ) und den frühesten Endzeitpunkt (FEZ) in der Vorwärtsrechnung bestimmen; bei mehreren Vorgängern zählt der größte FEZ.","Du kannst den spätesten Anfangszeitpunkt (SAZ) und den spätesten Endzeitpunkt (SEZ) in der Rückwärtsrechnung bestimmen; bei mehreren Nachfolgern zählt der kleinste SAZ.","Du kannst den Gesamtpuffer berechnen: GP = SAZ − FAZ oder GP = SEZ − FEZ.","Du kannst den freien Puffer berechnen: FP = FAZ des Nachfolgers − FEZ des Vorgangs.","Du kannst den kritischen Weg angeben, also die Vorgänge ohne Puffer, und daran die Projektdauer ablesen.","Du kannst einen fehlenden Vorgangsknoten aus der Vorgangsliste ergänzen."]},{"id":"AP1-1-2-3","titel":"Meilensteine, Termintreue und Reaktion auf Terminprobleme","art":"Wissen","rahmen":"Hier geht es um das Steuern der Termine, nicht um das Rechnen. Du erklärst, was ein Meilenstein ist, wie Termine fristgerecht geplant werden und was man tun kann, wenn ein Termin nicht gehalten wird. In der Prüfung 2026 waren zwei sinnvolle Reaktionen eines Projektleiters auf einen verfehlten Meilenstein zu beschreiben.","koennen":["Du kannst erklären, was ein Meilenstein ist: ein Zeitpunkt, zu dem ein Zwischenergebnis vorliegen und geprüft werden soll.","Du kannst Lösungsmöglichkeiten bei Terminproblemen beschreiben.","Du kannst sinnvolle Reaktionen auf einen nicht erreichten Meilenstein beschreiben.","Du kennst als Möglichkeiten: Ursache klären, Puffer nutzen, Personal aufstocken oder umverteilen, Vorgänge parallel legen, Umfang kürzen, Termin neu abstimmen und den Auftraggeber informieren.","Du kannst erklären, warum eine Verzögerung auf dem kritischen Weg das Projektende verschiebt."]}]},{"id":"AP1-1-3","titel":"Serviceanfragen und Störungen","stichpunkte":[{"id":"AP1-1-3-1","titel":"Support-Level, Ticketsystem und Bearbeitungsstatus","art":"Wissen","rahmen":"Serviceanfragen werden nach Schwierigkeit auf Support-Stufen verteilt und in einem Ticketsystem verfolgt. Für AP1 sollst du die drei Support-Level unterscheiden, den Weg einer Anfrage beschreiben und den Nutzen eines Ticketsystems erklären. Eskalationsstufen nennt der AP1-Katalog nicht.","koennen":["Du kannst First-, Second- und Third-Level-Support unterscheiden und eine Anfrage der passenden Stufe zuordnen.","Du kannst erklären, wozu ein Ticketsystem dient und wie daran der Bearbeitungsstatus sichtbar wird.","Du kannst typische Statuswerte eines Tickets nennen: offen, in Bearbeitung, wartet auf Rückmeldung, gelöst, geschlossen.","Du kannst Angaben nennen, die in ein Ticket gehören: Melder, Zeitpunkt, Beschreibung, Priorität, Bearbeiter, Lösung."]},{"id":"AP1-1-3-2","titel":"Fehler- und Störungsmanagement, Kundenkommunikation im Service","art":"Wissen","rahmen":"Der Katalog nennt Kundenkommunikation, Fehlermanagement und Störungs-Management als Teile der Arbeit an Serviceanfragen. Gemeint ist das geordnete Vorgehen von der Meldung bis zur Lösung, bei dem der Kunde informiert bleibt. Die technische Fehlersuche selbst steht bei den Fachthemen Hardware und Netzwerk.","koennen":["Du kannst beschreiben, wie eine Störung von der Meldung bis zur Lösung bearbeitet wird.","Du kennst eine sinnvolle Reihenfolge: aufnehmen, einordnen und priorisieren, Ursache eingrenzen, beheben, Erfolg prüfen, dokumentieren.","Du kannst einem Kunden den Stand der Bearbeitung verständlich und sachlich mitteilen.","Du kannst Rückfragen so stellen, dass ein Laie sie beantworten kann: was genau, seit wann, bei wem, was wurde geändert.","Du kannst erklären, warum bekannte Fehler und ihre Lösungen dokumentiert werden."]},{"id":"AP1-1-3-3","titel":"KI-Unterstützung in Arbeitsabläufen","art":"Wissen","rahmen":"Der Katalog nennt KI-Unterstützung als Teil der Arbeitsorganisation. Gefragt ist kein technisches KI-Wissen, sondern ein Blick für sinnvolle Einsatzstellen in einem Ablauf samt Nutzen und Grenzen. In der Prüfung Frühjahr 2025 war für drei Schritte eines Geschäftsablaufs zu beschreiben, wie KI dort helfen kann, und ein Vorteil für skeptische Mitarbeiter zu erläutern.","koennen":["Du kannst für einzelne Schritte eines beschriebenen Arbeitsablaufs einen sinnvollen KI-Einsatz beschreiben.","Du kannst einen Vorteil der KI-Unterstützung für die Mitarbeiter erläutern, zum Beispiel weniger Fehler oder mehr Zeit für anspruchsvolle Aufgaben.","Du kannst Grenzen und Risiken nennen: falsche Antworten, Datenschutz bei eingegebenen Daten, fehlende Nachvollziehbarkeit.","Du kannst begründen, warum Ergebnisse einer KI von einem Menschen geprüft werden müssen."]}]},{"id":"AP1-1-4","titel":"Leistung erbringen und abschließen","stichpunkte":[{"id":"AP1-1-4-1","titel":"Leistungserbringung vor Ort oder remote und Kundenvorgaben","art":"Wissen","rahmen":"Du unterscheidest, wie eine Leistung beim Kunden erbracht werden kann, und berücksichtigst seine Vorgaben. Das Katalogverb ist „kennen\": Varianten nennen, Vor- und Nachteile abwägen, Vorgaben wie Termin, Erfüllungsort, technische Voraussetzungen und Budget einhalten. Die Technik des Fernzugriffs steht im Ordner Software und Betriebssysteme.","koennen":["Du kannst Leistungserbringung vor Ort und remote vergleichen und für eine Situation die passende Variante begründen.","Du kannst Kundenvorgaben nennen, die einzuhalten sind: Termin und Erfüllungsort, technische Voraussetzungen wie Betriebssystem oder Hersteller, Budget.","Du kannst Vorteile der Fernwartung (keine Anfahrt, schnelle Reaktion) und ihre Grenzen (Hardwaredefekt, fehlende Netzverbindung, Sicherheitsbedenken) nennen.","Du kannst erklären, was der Erfüllungsort ist."]},{"id":"AP1-1-4-2","titel":"Abnahme, Übergabe und Einweisung: Abnahmeprotokoll","art":"Wissen","rahmen":"Am Ende eines Auftrags wird die Leistung übergeben, der Kunde eingewiesen und die Abnahme dokumentiert. Der Katalog nennt ausdrücklich den Inhalt des Abnahmeprotokolls. Du sollst wissen, was hineingehört und welche Bedeutung die Abnahme hat; dass ein vollständiges Protokoll frei zu formulieren ist, ist nicht belegt.","koennen":["Du kannst die Inhalte eines Abnahmeprotokolls nennen.","Du kennst als typische Inhalte: Vertragspartner, Gegenstand, Datum und Ort, geprüfte Leistungen mit Ergebnis, festgestellte Mängel mit Frist zur Behebung, Unterschriften.","Du kannst eine Übergabe und Einweisung planen: was übergeben wird, wer eingewiesen wird, was dokumentiert wird.","Du kannst erklären, welche Folgen die Abnahme hat: Die Leistung gilt als erbracht, die Vergütung wird fällig, die Gewährleistungsfrist beginnt."]},{"id":"AP1-1-4-3","titel":"Auftrag auswerten: Soll-Ist-Vergleich, Abweichungsanalyse, Nachfolgeaufträge","art":"Wissen","rahmen":"Nach dem Abschluss wird die erbrachte Leistung bewertet und dokumentiert. Du vergleichst geplante mit tatsächlichen Werten, benennst Abweichungen mit ihren Ursachen und erkennst Ansatzpunkte für Folgeaufträge. Das Rechnen mit Kosten steht bei der Vor- und Nachkalkulation im Ordner Wirtschaftlichkeit und Verträge.","koennen":["Du kannst erklären, was ein Soll-Ist-Vergleich ist und wozu eine Abweichungsanalyse dient.","Du kannst aus gegebenen Soll- und Ist-Werten die Abweichungen benennen und mögliche Ursachen nennen.","Du kannst Möglichkeiten nennen, aus einem abgeschlossenen Auftrag Nachfolgeaufträge zu gewinnen.","Du kennst Beispiele für Nachfolgeaufträge: Wartungsvertrag, Schulung, Erweiterung, Ersatzbeschaffung."]}]},{"id":"AP1-1-5","titel":"Qualitätsmanagement","stichpunkte":[{"id":"AP1-1-5-1","titel":"QM-Systeme, QS-Normen und Zertifizierung","art":"Wissen","rahmen":"Der Katalog verlangt hier nur ein Grundverständnis der Fachbegriffe. Du sollst erklären können, was ein betriebliches Qualitätsmanagementsystem ist, wozu Normen dienen und was eine Zertifizierung bedeutet. Einzelne Normabschnitte oder der Ablauf eines Audits sind nicht gefragt.","koennen":["Du kannst erklären, was ein betriebliches Qualitätsmanagementsystem ist.","Du kannst erklären, wozu Normen der Qualitätssicherung dienen.","Du kannst erklären, was eine Zertifizierung ist und welchen Nutzen sie für ein Unternehmen hat.","Du kennst die ISO 9001 als Beispiel einer Norm für Qualitätsmanagementsysteme.","Du kannst erklären, dass eine unabhängige Stelle das Zertifikat nach einer Prüfung ausstellt und es regelmäßig erneuert werden muss."]},{"id":"AP1-1-5-2","titel":"Qualitätsplanung, Qualitätslenkung und PDCA-Zyklus","art":"Wissen","rahmen":"Hier geht es um Qualitätsmaßnahmen im eigenen Arbeitsbereich. Du leitest Qualitätsziele aus Ist- und Ziel-Zustand ab, ordnest die Umsetzung als Qualitätslenkung ein und erklärst den PDCA-Zyklus als Kreislauf. Kennzahlen und den kontinuierlichen Verbesserungsprozess nennt der AP1-Katalog nicht.","koennen":["Du kannst Qualitätsplanung beschreiben: Ist-Zustand ermitteln und Ziel-Zustand festlegen.","Du kannst Qualitätslenkung als Umsetzung der Planung einordnen.","Du kannst die vier Schritte Plan, Do, Check, Act nennen und erklären.","Du kannst Maßnahmen aus einem Beispiel den vier Schritten des PDCA-Zyklus zuordnen."]},{"id":"AP1-1-5-3","titel":"Testprotokoll für einen eingerichteten Arbeitsplatz","art":"Wissen","rahmen":"Wenn ein Arbeitsplatz eingerichtet ist, wird geprüft und protokolliert, ob er der Spezifikation entspricht. In der Prüfung 2026 bildete ein Testprotokoll mit den Spalten Testfall, Beschreibung, erwartetes Ergebnis und Ergebnis den Rahmen einer ganzen Aufgabe: Abweichungen waren zu erklären und das weitere Vorgehen zu beschreiben. Du musst ein Testprotokoll lesen, Abweichungen fachlich deuten und sinnvolle Testfälle für einen Arbeitsplatz kennen.","koennen":["Du kannst den Aufbau eines Testprotokolls beschreiben: Testfall, Beschreibung, erwartetes Ergebnis, tatsächliches Ergebnis.","Du kannst eine Abweichung zwischen erwartetem und tatsächlichem Ergebnis fachlich begründen.","Du kannst nach einem fehlgeschlagenen Testfall weitere Prüfschritte vorschlagen.","Du kannst sinnvolle Testfälle für einen neuen Arbeitsplatz nennen: Hardware erkannt, Netzwerk und Internet erreichbar, Drucker, Anmeldung, benötigte Software startet."]}]}]},{"id":"AP1-2","titel":"Kunde, Markt und Unternehmen","bloecke":[{"id":"AP1-2-1","titel":"Markt und Vertrieb","stichpunkte":[{"id":"AP1-2-1-1","titel":"Marktformen und Käufer-/Verkäufermarkt","art":"Wissen","rahmen":"Du bewertest eine Marktsituation anhand der Zahl der Anbieter und Nachfrager. Der Katalog nennt als Beispiele Monopol, Oligopol, Polypol sowie Käufer- und Verkäufermarkt. Es reicht, eine beschriebene Situation der richtigen Marktform zuzuordnen und die Folgen für Preis und Verhandlungsposition zu erklären; Preisbildungsmodelle sind nicht gefragt.","koennen":["Du kannst Monopol, Oligopol und Polypol nach der Zahl der Anbieter unterscheiden und je ein Beispiel nennen.","Du kannst Käufermarkt und Verkäufermarkt unterscheiden.","Du kannst erklären, wer im Käufermarkt und wer im Verkäufermarkt die stärkere Verhandlungsposition hat und warum.","Du kannst eine beschriebene Marktsituation der passenden Marktform zuordnen."]},{"id":"AP1-2-1-2","titel":"Zielgruppen und Vertriebsformen: direkter und indirekter Vertrieb","art":"Wissen","rahmen":"Du grenzt ab, für wen ein Produkt oder eine Leistung gedacht ist, und kennst die beiden Wege, auf denen es zum Kunden kommt. Der Katalog führt die Vertriebsformen unter „Marketingaktivitäten unterstützen können\". Es bleibt bei Begriffen, Abgrenzung und Vor- und Nachteilen.","koennen":["Du kannst eine Zielgruppe für ein Produkt beschreiben und von anderen Gruppen abgrenzen.","Du kannst Merkmale nennen, nach denen Zielgruppen gebildet werden: Privat- oder Geschäftskunden, Branche, Unternehmensgröße, Bedarf, Budget.","Du kannst direkten und indirekten Vertrieb unterscheiden.","Du kannst je einen Vorteil nennen: beim direkten Vertrieb Kundennähe und volle Marge, beim indirekten Vertrieb größere Reichweite über Händler."]}]},{"id":"AP1-2-2","titel":"Bedarf ermitteln und beraten","stichpunkte":[{"id":"AP1-2-2-1","titel":"Bedarfsanalyse: Daten erheben und auswerten","art":"Wissen","rahmen":"Bevor ein Arbeitsplatz ausgestattet wird, muss der Bedarf des Kunden feststehen. Du sollst eine zielgruppengerechte Bedarfsanalyse durchführen können: eigene Daten erheben, etwa mit einer Kundenbefragung, und vorhandene Daten auswerten, etwa Anforderungen an Büroarbeitsplätze. Das Ergebnis ist die Grundlage für ein Angebot.","koennen":["Du kannst Wege nennen, den Bedarf eines Kunden selbst zu erheben, zum Beispiel Kundenbefragung, Interview oder Beobachtung am Arbeitsplatz.","Du kannst vorhandene Daten auswerten, um Anforderungen an einen Arbeitsplatz abzuleiten.","Du kannst aus einer Situationsbeschreibung den Bedarf eines Kunden ermitteln und daraus ein passendes Angebot ableiten.","Du kannst offene und geschlossene Fragen unterscheiden und passend einsetzen.","Du kannst Anforderungen in Muss- und Kann-Anforderungen trennen."]},{"id":"AP1-2-2-2","titel":"Lastenheft und Pflichtenheft","art":"Wissen","rahmen":"Der Katalog nennt zu beiden Dokumenten Zweck, Urheber und Inhalt. Du sollst sie sicher auseinanderhalten: wer schreibt welches, was steht drin, in welcher Reihenfolge entstehen sie. In der Prüfung Herbst 2024 waren Zweck und ein Inhaltsbeispiel für beide in eine Tabelle einzutragen. Ein ganzes Lasten- oder Pflichtenheft zu erstellen verlangt der AP1-Katalog nicht.","koennen":["Du kannst den Zweck des Lastenhefts erklären: Der Auftraggeber beschreibt, was er haben will.","Du kannst den Zweck des Pflichtenhefts erklären: Der Auftragnehmer beschreibt, wie er die Anforderungen umsetzen will.","Du kannst für beide Dokumente den Urheber nennen und je ein Beispiel für einen Inhalt angeben.","Du kannst die Reihenfolge erklären: Das Pflichtenheft baut auf dem Lastenheft auf und wird nach der Freigabe durch den Auftraggeber Vertragsgrundlage."]},{"id":"AP1-2-2-3","titel":"Kundenkommunikation und Kommunikationsmodelle: 4-Ohren-Modell, Sender-Empfänger-Modell","art":"Wissen","rahmen":"Du sollst Methoden der Kundenberatung kennen und beurteilen. Dazu gehören die beiden im Katalog genannten Kommunikationsmodelle und ein Gespräch, das zur Situation und zum Kunden passt. Erwartet wird, eine Aussage mit dem Modell zu deuten und Störungen der Verständigung zu erklären.","koennen":["Du kannst das Sender-Empfänger-Modell erklären: Nachricht, Verschlüsseln, Übertragungsweg, Entschlüsseln, Rückmeldung.","Du kannst die vier Seiten einer Nachricht nennen: Sachinhalt, Selbstkundgabe, Beziehung, Appell.","Du kannst eine Kundenaussage auf allen vier Seiten deuten und ein Missverständnis damit erklären.","Du kannst dein Gesprächsverhalten an Situation und Kunden anpassen, zum Beispiel Fachsprache bei Laien vermeiden.","Du kannst Ursachen für gestörte Kommunikation nennen: Fachbegriffe, Lärm, unterschiedliche Erwartungen, fehlende Rückfrage."]}]},{"id":"AP1-2-3","titel":"Informieren und präsentieren","stichpunkte":[{"id":"AP1-2-3-1","titel":"Englische Fachtexte verstehen","art":"Wissen","rahmen":"Englisch wird nicht als eigenes Fach geprüft, sondern steckt in den Aufgaben. In beiden Prüfungen nach aktuellem Katalog war ein kurzer englischer Herstellertext oder Satz zu lesen und der Inhalt auf Deutsch wiederzugeben; im Frühjahr 2025 durfte auch auf Englisch geantwortet werden. Du musst englische IT-Fachtexte sinngemäß verstehen und gezielt Informationen herausziehen. Selbst längere englische Texte zu schreiben war nicht verlangt.","koennen":["Du kannst aus einem kurzen englischen Fachtext die gefragten Informationen herausziehen und auf Deutsch nennen.","Du kannst englische Bezeichner und Kommentare in einem Quelltext verstehen.","Du kennst gängige englische Fachbegriffe aus Hardware, Netzwerk und IT-Sicherheit, zum Beispiel firewall, update, vulnerability, backup, unauthorized access.","Du kannst einen englischen Satz sinngemäß übersetzen, ohne Wort für Wort vorzugehen."]},{"id":"AP1-2-3-2","titel":"Informationen aufbereiten, Quellen auswerten und präsentieren","art":"Wissen","rahmen":"Du sollst Informationen aus technischen und kaufmännischen Texten gewinnen, verständlich aufbereiten und vor Kunden präsentieren können. Der Katalog nennt dazu „Präsentation und Medienkompetenz\". Belegt ist bisher nur die Frage nach Wegen der Informationsbeschaffung; eine Präsentation zu entwerfen wurde nach aktuellem Katalog nicht verlangt.","koennen":["Du kannst Quellen nennen, aus denen du Fachinformationen beschaffst, zum Beispiel Herstellerdokumentation, Fachforen, Suchmaschinen.","Du kannst aus einem technischen oder kaufmännischen Text die für einen Kunden wichtigen Angaben herausarbeiten.","Du kannst die Verlässlichkeit einer Quelle einschätzen: Herausgeber, Aktualität, Belege.","Du kannst Regeln für eine gute Präsentation nennen: Aufbau mit Einleitung, Hauptteil und Schluss, wenig Text je Folie, Sprache der Zielgruppe.","Du kannst erklären, was Medienkompetenz bedeutet: Medien gezielt auswählen, bedienen und ihre Inhalte kritisch bewerten."]}]},{"id":"AP1-2-4","titel":"Unternehmen und Organisation","stichpunkte":[{"id":"AP1-2-4-1","titel":"Unternehmensziele und Leitbild: ökonomisch, ökologisch, sozial","art":"Wissen","rahmen":"Du sollst die Zielsetzungen eines Unternehmens seinem Leitbild entnehmen können. Der Katalog teilt die Ziele in ökonomische, ökologische und soziale. Erwartet wird, Ziele aus einem Text herauszulesen, sie einzuordnen und Beispiele zu nennen; in der Prüfung Herbst 2024 waren ökologische Gesichtspunkte einer Neuanschaffung zu beschreiben.","koennen":["Du kannst erklären, was ein Unternehmensleitbild ist.","Du kannst Ziele aus einem Leitbild herauslesen und als ökonomisch, ökologisch oder sozial einordnen.","Du kannst je ein Beispiel nennen: Umsatz und Gewinn, Ressourcenschonung und Nachhaltigkeit, gute Arbeitsbedingungen.","Du kannst ökologische Gesichtspunkte einer Anschaffung beschreiben, zum Beispiel Energieverbrauch, Materialeinsatz, Entsorgung des Altgeräts.","Du kannst an einem Beispiel zeigen, wie zwei Ziele miteinander in Konflikt geraten."]},{"id":"AP1-2-4-2","titel":"Aufbauorganisation und Vollmachten: Einlinien-, Mehrlinien-, Matrixorganisation","art":"Wissen","rahmen":"Du stimmst die Leistungserbringung mit der Aufbauorganisation des eigenen Unternehmens ab. Dafür musst du die drei im Katalog genannten Organisationsformen unterscheiden und wissen, wer was entscheiden darf. Rechtsformen und weitere Leitungssysteme nennt der AP1-Katalog nicht.","koennen":["Du kannst Einliniensystem, Mehrliniensystem und Matrixorganisation an einem Organigramm erkennen.","Du kannst die drei Formen unterscheiden: eine weisungsbefugte Stelle, mehrere fachliche Vorgesetzte, Überschneidung von zwei Gliederungen.","Du kannst je einen Vorteil und einen Nachteil nennen, zum Beispiel klare Zuständigkeit gegenüber langen Dienstwegen.","Du kannst erklären, was Handlungs- und Entscheidungsspielräume und Vollmachten sind.","Du kannst Handlungsvollmacht und Prokura unterscheiden."]}]},{"id":"AP1-2-5","titel":"Veränderungen begleiten","stichpunkte":[{"id":"AP1-2-5-1","titel":"Veränderungsprozesse: Schritte, Chancen und Einbeziehung der Mitarbeiter","art":"Wissen","rahmen":"Wenn neue IT eingeführt wird, ändert sich die Arbeit der Betroffenen. Du sollst solche Veränderungsprozesse begleiten und unterstützen: die Schritte darstellen, die Chancen betonen und die Mitarbeiter einbeziehen und qualifizieren. In der Prüfung Frühjahr 2025 war ein Vorteil einer Neuerung für skeptische Mitarbeiter zu erläutern; der Podcast führt „Change Management\" für beide folgenden Termine.","koennen":["Du kannst die Schritte einer Veränderung benennen und in eine sinnvolle Reihenfolge bringen.","Du kannst die Chancen einer Veränderung für die Betroffenen herausstellen.","Du kannst Maßnahmen nennen, mit denen Mitarbeiter einbezogen werden: früh informieren, beteiligen, Rückmeldungen aufnehmen.","Du kannst Blended Learning und den Einsatz von Multiplikatoren als Wege der Mitarbeiterqualifizierung erklären.","Du kannst erklären, dass Blended Learning Präsenzschulung und Online-Lernen verbindet und Multiplikatoren ihr Wissen an Kollegen weitergeben."]},{"id":"AP1-2-5-2","titel":"Rollen und Widerstände im Veränderungsprozess","art":"Wissen","rahmen":"Menschen reagieren unterschiedlich auf Veränderungen. Der Katalog nennt vier Typen und drei Ursachen von Widerstand. Du sollst die Typen an ihrem Verhalten erkennen, Ursachen benennen und passende Reaktionen vorschlagen.","koennen":["Du kannst Promoter, Bremser, Skeptiker und Widerständler unterscheiden und eine beschriebene Person zuordnen.","Du kannst Ursachen von Widerständen nennen: Angst vor Kompetenzverlust, Wissenslücken, persönliche Historie.","Du kannst zu jeder Ursache eine passende Maßnahme vorschlagen, zum Beispiel Schulung bei Wissenslücken.","Du kannst erklären, warum Promoter gezielt als Unterstützer eingesetzt werden."]}]}]},{"id":"AP1-3","titel":"Wirtschaftlichkeit und Verträge","bloecke":[{"id":"AP1-3-1","titel":"Kosten und Kalkulation","stichpunkte":[{"id":"AP1-3-1-1","titel":"Kostenarten: Anschaffung, Betrieb, Lizenz, Finanzierung, fix und variabel","art":"Wissen","rahmen":"Bevor du rechnest, musst du Kosten einordnen können. Der Katalog nennt Anschaffungs-, Betriebs-, Lizenz- und Finanzierungskosten sowie variable und fixe Kosten. Du sollst die Positionen eines Angebots der richtigen Kostenart zuordnen und einmalige von laufenden Kosten trennen.","koennen":["Du kannst Anschaffungs-, Betriebs-, Lizenz- und Finanzierungskosten unterscheiden und Beispiele nennen.","Du kannst fixe und variable Kosten unterscheiden.","Du kannst die Positionen eines Angebots als einmalige oder laufende Kosten einordnen.","Du kannst erklären, warum der niedrigste Kaufpreis nicht das günstigste Angebot sein muss: Entscheidend sind die Kosten über die ganze Nutzungsdauer."]},{"id":"AP1-3-1-2","titel":"Kosten über die Nutzungsdauer berechnen","art":"Rechnen","rahmen":"Das ist die häufigste Rechenaufgabe in AP1: aus Kaufpreis, Nutzungsdauer und laufenden Kosten die Kosten je Monat oder über mehrere Jahre bestimmen. In jeder ausgewerteten AP1-Prüfung kam eine solche Rechnung vor, meist mit drei bis sieben Punkten und verlangtem Rechenweg. Es bleibt bei Grundrechenarten, Prozentrechnung und Rundung.","koennen":["Du kannst einen Kaufpreis gleichmäßig auf die Nutzungsdauer verteilen und laufende Kosten für Verbrauch, Wartung und Lizenzen dazurechnen.","Du kannst Kosten je Monat und je Jahr ineinander umrechnen und über mehrere Jahre aufsummieren.","Du kannst einen Rabatt abziehen und aus einem Nettobetrag den Bruttobetrag mit 19 % Umsatzsteuer berechnen.","Du kannst entgangenen Umsatz als Kosten berücksichtigen, zum Beispiel Arbeitszeit, die wegen einer Schulung ausfällt.","Du kannst den Rechenweg nachvollziehbar aufschreiben und das Ergebnis wie verlangt runden."]},{"id":"AP1-3-1-3","titel":"Machbarkeit mit Budgetvorgabe, Vor- und Nachkalkulation","art":"Rechnen","rahmen":"Du prüfst, ob ein Vorhaben mit dem vorgegebenen Budget machbar ist, und vergleichst die geplanten mit den tatsächlichen Kosten. Der Katalog nennt die Machbarkeitsanalyse mithilfe einer Budgetvorgabe sowie Vor- und Nachkalkulation. Erwartet wird eine einfache Aufstellung aus Stunden, Stundensatz und Material; in den Prüfungen nach aktuellem Katalog gab es dazu noch keine eigene Aufgabe.","koennen":["Du kannst die Kosten eines Vorhabens aus Arbeitsstunden, Stundensatz und Materialkosten zusammenstellen.","Du kannst prüfen, ob die Kosten innerhalb einer Budgetvorgabe liegen, und das Ergebnis begründen.","Du kannst erklären, was Vor- und Nachkalkulation sind und wann sie erstellt werden.","Du kannst aus Vor- und Nachkalkulation die Abweichung in Euro berechnen.","Du kannst die Abweichung auch in Prozent der geplanten Kosten angeben."]},{"id":"AP1-3-1-4","titel":"Rechnung prüfen: Rabatt, Umsatzsteuer, Skonto","art":"Rechnen","rahmen":"Der Anhang des Katalogs enthält eine Musterrechnung mit Rabatt, Nettopreis, Mehrwertsteuer, Rechnungsbetrag und Skonto. Für Herbst 2025 nennen der Podcast und Gedächtnisprotokolle eine Aufgabe, in der Rechnungspositionen zu kontrollieren und zu begründen waren. Die genaue Tiefe ist nicht belegt, weil diese Prüfung nicht im Original vorlag; sicher brauchst du den Rechenweg der Musterrechnung.","koennen":["Du kannst die Positionen einer Rechnung nachrechnen: Menge mal Einzelpreis, Rabatt, Nettopreis, Umsatzsteuer, Rechnungsbetrag.","Du kannst Skonto abziehen und den Zahlbetrag bei Zahlung innerhalb der Skontofrist berechnen.","Du kannst eine Rechnung mit der Bestellung vergleichen und Abweichungen bei Menge, Preis oder Zahlungsziel benennen.","Du kennst die Reihenfolge: erst Rabatt abziehen, dann Umsatzsteuer aufschlagen; Skonto wird erst bei der Zahlung abgezogen.","Du kannst Pflichtangaben einer Rechnung nennen, zum Beispiel Rechnungsnummer, Datum, Leistungsbeschreibung, Steuersatz und Steuerbetrag."]},{"id":"AP1-3-1-5","titel":"Wertschöpfung","art":"Wissen","rahmen":"Der Katalog nennt „Wertschöpfung\" als letzten Spiegelstrich unter „Wirtschaftlichkeit von IT-Systemen bestimmen und beurteilen\", ohne Erläuterung. In keiner ausgewerteten Prüfung kam der Begriff vor.","koennen":["Du kannst Wertschöpfung als Differenz zwischen dem Wert der eigenen Leistung und den zugekauften Vorleistungen erklären.","Du kannst an einem Beispiel beschreiben, wie ein IT-System zur Wertschöpfung beiträgt, etwa durch schnellere Abläufe oder weniger Fehler.","Du kannst die Stufen einer einfachen Wertschöpfungskette nennen: Beschaffung, Leistungserstellung, Absatz."]}]},{"id":"AP1-3-2","titel":"Finanzierung und Angebotsvergleich","stichpunkte":[{"id":"AP1-3-2-1","titel":"Kostenvergleich rechnen: Kauf, Leasing, Finanzierung, Pay-per-Use, Eigenleistung oder Fremdvergabe","art":"Rechnen","rahmen":"Du vergleichst Beschaffungswege rechnerisch. Der Katalog spricht von einem „einfachen Kostenvergleich\" zwischen Leasing, Kauf, Finanzierung und Pay-per-Use und nennt Finanzierungskosten. In der Prüfung Herbst 2024 war ein Tilgungsplan für ein Darlehen mit gleichbleibender Tilgung auszufüllen; in der Prüfung 2026 waren die Kosten einer internen Entwicklung mit denen einer externen Vergabe zu vergleichen.","koennen":["Du kannst die Gesamtkosten von Kauf, Leasing, Finanzierung und Pay-per-Use über einen gegebenen Zeitraum berechnen und vergleichen.","Du kannst für ein Darlehen mit gleichbleibender Tilgung je Jahr Restschuld, Zinsen, Tilgung und Zahlung berechnen.","Du kannst die Summe der Zinsen als Finanzierungskosten angeben.","Du kannst die Kosten einer internen Lösung und einer externen Vergabe aus Stunden und Stundensätzen berechnen und vergleichen.","Du kannst das Ergebnis beurteilen und Gründe gegen eine Fremdvergabe nennen, die nicht in der Rechnung stehen, zum Beispiel Abhängigkeit und Weitergabe von Know-how.","Du kannst die Nutzungsmenge bestimmen, ab der sich ein Kauf gegenüber Pay-per-Use lohnt."]},{"id":"AP1-3-2-2","titel":"Quantitativer Angebotsvergleich und Preis-Leistungs-Verhältnis","art":"Rechnen","rahmen":"Beim quantitativen Angebotsvergleich zählt, was ein Angebot unter dem Strich kostet. Du rechnest die Angebote auf eine gemeinsame Basis um und stellst Preis und Leistung gegenüber. Der Katalog nennt das Thema an drei Stellen; eine reine Preisvergleichsrechnung war in den Prüfungen nach aktuellem Katalog aber nicht dran, dort lag der Schwerpunkt auf der Nutzwertanalyse.","koennen":["Du kannst mehrere Angebote auf eine gemeinsame Basis bringen, zum Beispiel Gesamtpreis für die benötigte Menge oder Kosten je Monat.","Du kannst das Preis-Leistungs-Verhältnis zweier Angebote vergleichen, etwa über den Preis je Leistungseinheit.","Du kannst das rechnerisch günstigste Angebot bestimmen und das Ergebnis begründen.","Du kannst Rabatt, Skonto und Bezugskosten wie Versand in den Vergleich einrechnen."]},{"id":"AP1-3-2-3","titel":"Qualitativer Angebotsvergleich mit der Nutzwertanalyse","art":"Rechnen","rahmen":"Die Nutzwertanalyse macht Angebote vergleichbar, wenn nicht nur der Preis zählt. Sie steht zweimal im Katalog und war laut Podcast das punktstärkste Einzelthema der bisherigen AP1-Prüfungen. Im Frühjahr 2025 waren für drei Geräte je Kriterium Rangpunkte selbst zu vergeben und zu summieren, ohne Gewichtung; im Frühjahr 2024 war eine gewichtete Tabelle zu vervollständigen. Du musst beide Formen beherrschen.","koennen":["Du kannst aus technischen Daten je Kriterium Punkte vergeben, zum Beispiel als Rangfolge mit 3 für den besten und 1 für den schlechtesten Wert.","Du kannst Punkte mit Gewichtungsfaktoren multiplizieren und je Angebot zum Nutzwert aufsummieren.","Du kannst fehlende Werte in einer teilweise ausgefüllten Nutzwerttabelle ergänzen: Gewichtung, Punkte, gewichtete Punkte, Summe.","Du kannst eine Rangfolge der Angebote bilden und das beste auswählen.","Du kannst eine Zusatzbedingung berücksichtigen, die ein Angebot ausschließt, auch wenn es die meisten Punkte hat.","Du beachtest, dass bei Kosten der niedrigste Wert die meisten Punkte bekommt."]}]},{"id":"AP1-3-3","titel":"Verträge","stichpunkte":[{"id":"AP1-3-3-1","titel":"Kauf-, Miet- und Leasingvertrag; Vertragsbestandteile","art":"Wissen","rahmen":"Du sollst Vertragsarten und Vertragsbestandteile kennen und unterscheiden. Für Kauf, Miete und Leasing heißt das: wer wird Eigentümer, wer trägt welche Pflichten, was spricht für welche Form. In der Prüfung Herbst 2024 waren Vorteile des Leasings und die Möglichkeiten nach Vertragsende zu beschreiben, im Frühjahr 2024 das Zustandekommen und die Inhalte eines Kaufvertrags.","koennen":["Du kannst Kaufvertrag, Mietvertrag und Leasing unterscheiden, vor allem danach, wer Eigentümer wird.","Du kannst Vorteile des Leasings gegenüber dem Kauf beschreiben, zum Beispiel geschonte Liquidität und gleichbleibende, planbare Raten.","Du kannst Möglichkeiten nach Ablauf eines Leasingvertrags nennen: Rückgabe, Verlängerung, Kauf, Austausch gegen ein neues Gerät.","Du kannst erklären, wie ein Kaufvertrag zustande kommt: durch zwei übereinstimmende Willenserklärungen, Antrag und Annahme.","Du kannst Vertragsbestandteile nennen: Leistungsbeschreibung, Termine, Entgelte, Sanktionen bzw. Konventionalstrafen."]},{"id":"AP1-3-3-2","titel":"Werkvertrag, Dienstvertrag, Servicevertrag und Service Level Agreement","art":"Wissen","rahmen":"Bei Verträgen über Arbeit kommt es darauf an, was geschuldet ist. Du sollst Werkvertrag und Dienstvertrag sicher unterscheiden und wissen, was ein Servicevertrag und ein Service Level Agreement regeln. In den ausgewerteten AP1-Prüfungen gab es dazu keine Aufgabe.","koennen":["Du kannst Werkvertrag und Dienstvertrag unterscheiden: Beim Werkvertrag wird ein Erfolg geschuldet, beim Dienstvertrag die Tätigkeit.","Du kannst IT-Leistungen zuordnen, zum Beispiel die Erstellung einer Software als Werkvertrag und eine Schulung als Dienstvertrag.","Du kannst erklären, was ein Servicevertrag regelt.","Du kannst erklären, was ein Service Level Agreement ist.","Du kennst typische Inhalte eines SLA: Verfügbarkeit, Reaktionszeit, Wiederherstellungszeit, Servicezeiten, Folgen bei Verstößen."]},{"id":"AP1-3-3-3","titel":"Vertragsstörungen und Mängelarten: Schlechtleistung, Falschlieferung, Minderlieferung","art":"Wissen","rahmen":"Du sollst erkennen, wann ein Vertrag nicht ordnungsgemäß erfüllt wird, und die Mängelarten des Katalogs unterscheiden. Erwartet wird die Zuordnung eines geschilderten Falls und eine sinnvolle Reaktion; im Frühjahr 2024 waren zwei Kaufvertragsstörungen und je eine vorbeugende Maßnahme zu nennen. Fristen und Paragrafen im Einzelnen waren nicht gefragt.","koennen":["Du kannst Vertragsstörungen nennen und einen geschilderten Fall zuordnen.","Du kennst Lieferverzug, Zahlungsverzug, Annahmeverzug und mangelhafte Lieferung.","Du kannst Schlechtleistung, Falschlieferung und Minderlieferung unterscheiden.","Du kannst zu einer Vertragsstörung eine vorbeugende Maßnahme nennen.","Du kannst die Rechte des Käufers bei einem Mangel nennen: zuerst Nacherfüllung durch Nachbesserung oder Ersatzlieferung, danach Minderung, Rücktritt oder Schadensersatz."]}]},{"id":"AP1-3-4","titel":"Urheberrecht und Lizenzen","stichpunkte":[{"id":"AP1-3-4-1","titel":"Urheberrecht und Lizenzen: EULA, OEM, GNU GPL, Pay-per-Use","art":"Wissen","rahmen":"Software ist urheberrechtlich geschützt; wer sie nutzt, braucht eine Lizenz. Du sollst die Grundlagen des Urheberschutzes kennen und Lizenzmodelle unterscheiden. In der Prüfung 2026 waren zwei Kernideen einer verbreiteten Open-Source-Lizenz, der GNU GPL, zu beschreiben.","koennen":["Du kannst erklären, dass das Urheberrecht dem Urheber die Rechte an seinem Werk sichert und Software nur im Rahmen einer Lizenz genutzt und kopiert werden darf.","Du kannst EULA (Endbenutzer-Lizenzvertrag, dem der Nutzer bei der Installation zustimmt), OEM-Lizenz (Lizenz, die zusammen mit einem Gerät verkauft wird und an dieses gebunden ist) und GNU GPL (Lizenz für freie Software) unterscheiden.","Du kannst zwei Kernideen der GNU GPL beschreiben.","Du kennst als Grundgedanken der GPL: Die Software darf frei genutzt, untersucht, verändert und weitergegeben werden; weitergegebene Abwandlungen müssen wieder unter derselben Lizenz stehen (Copyleft).","Du kannst Pay-per-Use als Abrechnung nach tatsächlicher Nutzung erklären.","Du kannst erklären, was ein Lizenzvertrag regelt."]},{"id":"AP1-3-4-2","titel":"Open Source und proprietäre Software","art":"Wissen","rahmen":"Bei der Softwareauswahl steht oft die Frage, ob eine quelloffene oder eine herstellergebundene Lösung besser passt. Du sollst beide Modelle erklären und ihre Vorteile gegenüberstellen. Im Frühjahr 2025 waren je zwei Vorteile zu nennen.","koennen":["Du kannst Open-Source-Software und proprietäre Software unterscheiden.","Du kannst Vorteile von Open-Source-Software nennen, zum Beispiel keine oder geringe Lizenzkosten und offener, überprüfbarer Quellcode.","Du kannst Vorteile proprietärer Software nennen, zum Beispiel Hersteller-Support und gutes Zusammenspiel mit anderen Produkten desselben Herstellers.","Du kannst erklären, dass Open Source nicht automatisch kostenlos bedeutet und auch dort Lizenzbedingungen gelten."]}]}]},{"id":"AP1-4","titel":"Hardware und Arbeitsplatz","bloecke":[{"id":"AP1-4-1","titel":"Geräte und Komponenten","stichpunkte":[{"id":"AP1-4-1-1","titel":"Geräteklassen und Arbeitsplatzsysteme auswählen","art":"Wissen","rahmen":"Du wählst für einen beschriebenen Bedarf die passende Geräteklasse und begründest die Wahl. Der Katalog nennt Desktops, Notebooks, All-in-One, Thin Clients, Tablets und Smartphones sowie mobile und stationäre Arbeitsplatzsysteme. Es geht um Eignung und Begründung, nicht um technische Einzelheiten der Geräte.","koennen":["Du kannst Desktop, Notebook, All-in-One, Thin Client, Tablet und Smartphone unterscheiden.","Du kannst für einen beschriebenen Arbeitsplatz eine Geräteklasse auswählen und die Wahl begründen.","Du kannst mobile und stationäre Arbeitsplatzsysteme gegenüberstellen.","Du kannst erklären, dass ein Thin Client kaum eigene Rechenleistung hat und seine Anwendungen von einem Server bezieht."]},{"id":"AP1-4-1-2","titel":"Prozessor, Mainboard, Arbeitsspeicher, Grafikkarte und Netzteil","art":"Wissen","rahmen":"Du sollst marktgängige Hardware kennen, unterscheiden und beurteilen. Das bedeutet: Kenngrößen der Komponenten lesen, Angebote vergleichen und prüfen, ob Teile zusammenpassen. Im Herbst 2024 war die Verträglichkeit von drei Speicherriegeln mit einem vorhandenen Notebook zu beurteilen; 2026 war zu beschreiben, wie die Größe des Arbeitsspeichers geprüft und ein defekter Riegel gefunden wird.","koennen":["Du kannst die Aufgaben von CPU, Mainboard, Arbeitsspeicher, Grafikkarte und Netzteil erklären.","Du kannst Kenngrößen aus einem Datenblatt lesen und vergleichen, zum Beispiel Kernzahl und Taktfrequenz der CPU, Größe und Typ des Arbeitsspeichers.","Du kannst beurteilen, ob ein Speicherriegel zu einem System passt: Die DDR-Generation muss gleich sein; bei unterschiedlichem Takt gilt der niedrigere.","Du kannst Wege nennen, die Größe des verbauten Arbeitsspeichers zu prüfen, und beschreiben, wie du einen defekten Riegel eingrenzt.","Du kennst dafür die Anzeige im BIOS/UEFI und in den Systeminformationen des Betriebssystems sowie das Testen jedes Riegels einzeln."]},{"id":"AP1-4-1-3","titel":"Datenspeicher: HDD und SSD","art":"Wissen","rahmen":"Der Katalog nennt Datenspeicher (SSD/HDD) bei den Kenngrößen und Leistungsdaten. Du sollst beide Techniken vergleichen und für einen Einsatzzweck empfehlen. Im Herbst 2024 waren drei Vorteile einer SSD gegenüber einer HDD zu nennen.","koennen":["Du kannst HDD und SSD nach dem Funktionsprinzip unterscheiden: rotierende Magnetscheiben gegenüber Flash-Speicher ohne bewegliche Teile.","Du kannst Vorteile der SSD nennen: schnelleres Lesen und Schreiben, unempfindlich gegen Erschütterung, lautlos, geringerer Energiebedarf.","Du kannst einen Vorteil der HDD nennen: niedrigerer Preis je Gigabyte bei großen Kapazitäten.","Du kannst Anschlussarten für Datenspeicher zuordnen: SATA sowie M.2 mit NVMe."]},{"id":"AP1-4-1-4","titel":"Peripheriegeräte und Anschlüsse","art":"Wissen","rahmen":"Zum Arbeitsplatz gehören Peripheriegeräte und die Anschlüsse, über die sie verbunden werden. Der Katalog nennt nur „Peripheriegeräte\"; das Erkennen von Steckern und Buchsen steht dort nicht, kam aber im Frühjahr 2025 und im Frühjahr 2024 als Zuordnung von Bildern zu Bezeichnungen vor. Du musst gängige Anschlüsse am Aussehen erkennen und ihrem Zweck zuordnen.","koennen":["Du kannst Peripheriegeräte nennen und nach Ein- und Ausgabe einordnen, zum Beispiel Monitor, Drucker, Scanner, Multifunktionsgerät.","Du kannst gängige Anschlüsse am Bild erkennen: RJ45, USB Typ A, USB Typ C, Kaltgerätebuchse, HDMI, DisplayPort, DVI.","Du kannst die Symbole für WLAN und Bluetooth benennen.","Du kannst einem Anschluss seinen Zweck zuordnen: Netzwerk, Daten, Bild, Stromversorgung.","Du kannst erklären, was Daisy Chaining ist: Geräte werden hintereinander an einen Anschluss gehängt, zum Beispiel mehrere Monitore."]}]},{"id":"AP1-4-2","titel":"Kenngrößen berechnen","stichpunkte":[{"id":"AP1-4-2-1","titel":"Zahlensysteme und Präfixe: binär, hexadezimal, kB und KiB","art":"Rechnen","rahmen":"Zahlensysteme brauchst du für Subnetting, IPv6- und MAC-Adressen, die Präfixe für jede Rechnung mit Datenmengen. Der Anhang des Katalogs legt fest: Datenmengen werden mit Binärpräfixen angegeben (KiB, MiB, GiB), physikalische Größen mit Dezimalpräfixen. In der Prüfung 2026 war zu begründen und nachzurechnen, warum ein Datenträger mit 1.000 GB als 931 GiB angezeigt wird.","koennen":["Du kannst Zahlen zwischen Dezimal-, Binär- und Hexadezimalsystem umrechnen.","Du kennst die Zweierpotenzen bis 2 hoch 10 und kannst mit ihnen rechnen.","Du kannst Dezimalpräfixe (1 kB = 1.000 Byte) und Binärpräfixe (1 KiB = 1.024 Byte) unterscheiden und sagen, wofür welche verwendet werden.","Du kannst zwischen Dezimal- und Binärpräfixen umrechnen, zum Beispiel GB in GiB.","Du kannst Bit und Byte ineinander umrechnen: 8 Bit sind 1 Byte."]},{"id":"AP1-4-2-2","titel":"Datenmengen, Übertragungsraten und Übertragungszeiten berechnen","art":"Rechnen","rahmen":"Der Katalog nennt Übertragungsraten, -zeiten und Datenmengen von digitalisierten Dokumenten, Videos usw. als Kenngrößen. Du berechnest aus Anzahl, Auflösung oder Bittiefe den Speicherbedarf und aus Datenmenge und Übertragungsrate die Dauer. Im Frühjahr 2024 kamen beide Rechnungen vor; der Podcast nennt „Dateigrößen berechnen\" auch für Herbst 2025 und Frühjahr 2026.","koennen":["Du kannst den Speicherbedarf aus der Anzahl der Werte und den Bit je Wert berechnen und in KiB, MiB oder GiB angeben.","Du kannst aus der Bittiefe die Zahl der darstellbaren Werte berechnen, zum Beispiel 2 hoch 24 Farben bei 3 mal 8 Bit.","Du kannst die Übertragungsdauer aus Datenmenge und Übertragungsrate berechnen und in Minuten und Sekunden angeben.","Du achtest auf die Einheiten: Datenmenge in Byte mit Binärpräfix, Übertragungsrate in Bit je Sekunde mit Dezimalpräfix.","Du kannst einen Mehrbedarf in Prozent ausdrücken.","Du kannst den Speicherbedarf eines unkomprimierten Bildes aus Breite, Höhe und Farbtiefe berechnen."]},{"id":"AP1-4-2-3","titel":"Leistung, Energie, Wirkungsgrad und Stromkosten berechnen","art":"Rechnen","rahmen":"Der Katalog nennt Strom, Spannung, Leistung, Wirkungsgrad, Energie und Energiekosten. Du rechnest mit den Grundformeln und kommst von der Leistungsaufnahme über die Betriebsdauer zu den Stromkosten.
